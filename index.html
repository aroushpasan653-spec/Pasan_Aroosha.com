<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | Pasan Aroosha</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0f19;
      color: white;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;

      background: #111827;
      border: 1px solid #252d40;
      border-radius: 18px;

      padding: 40px;

      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }

    .logo {
      text-align: center;
      margin-bottom: 10px;
      font-size: 28px;
      font-weight: bold;
    }

    .logo span {
      color: #8b5cf6;
    }

    .subtitle {
      text-align: center;
      color: #8f96a8;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      color: #d1d5db;
      font-size: 14px;
    }

    .input-group input {
      width: 100%;
      padding: 13px 14px;

      background: #0b0f19;
      color: white;

      border: 1px solid #30394d;
      border-radius: 9px;

      outline: none;
      font-size: 15px;
    }

    .input-group input:focus {
      border-color: #8b5cf6;
    }

    #loginBtn {
      width: 100%;

      padding: 13px;

      border: none;
      border-radius: 9px;

      background: #8b5cf6;
      color: white;

      font-size: 15px;
      font-weight: bold;

      cursor: pointer;
      transition: 0.3s;
    }

    #loginBtn:hover {
      background: #7c3aed;
    }

    #loginBtn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      min-height: 22px;
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .signup-text {
      text-align: center;
      margin-top: 25px;
      color: #8f96a8;
      font-size: 14px;
    }

    #signupBtn {
      margin-top: 10px;

      width: 100%;

      padding: 12px;

      background: transparent;
      color: #c4b5fd;

      border: 1px solid #8b5cf6;
      border-radius: 9px;

      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    #signupBtn:hover {
      background: #8b5cf6;
      color: white;
    }

    .back-home {
      display: block;

      text-align: center;

      margin-top: 20px;

      color: #8f96a8;
      text-decoration: none;

      font-size: 14px;
    }

    .back-home:hover {
      color: #a78bfa;
    }

    @media (max-width: 500px) {
      .login-box {
        padding: 30px 22px;
      }
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      Pasan<span>Aroosha</span>
    </div>

    <div class="subtitle">
      Login to continue
    </div>


    <!-- EMAIL -->

    <div class="input-group">

      <label for="email">
        Email Address
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        autocomplete="email"
      >

    </div>


    <!-- PASSWORD -->

    <div class="input-group">

      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="current-password"
      >

    </div>


    <!-- LOGIN BUTTON -->

    <button id="loginBtn">
      Login
    </button>


    <!-- MESSAGE -->

    <div id="message"></div>


    <!-- SIGN UP -->

    <div class="signup-text">
      Don't have an account?
    </div>

    <button id="signupBtn">
      Create New Account
    </button>


    <!-- BACK HOME -->

    <a href="index.html" class="back-home">
      ← Back to Home
    </a>

  </div>


  <!-- ================= FIREBASE ================= -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";


    /* Firebase Configuration */

    const firebaseConfig = {

      apiKey: "AIzaSyB3G98XBTZH6NFiZx6NQmyEKR8g6vnSYNQ",

      authDomain: "pasan-fc8e2.firebaseapp.com",

      projectId: "pasan-fc8e2",

      storageBucket: "pasan-fc8e2.firebasestorage.app",

      messagingSenderId: "330282693990",

      appId: "1:330282693990:web:f754a4a09efaa73ab5c4a7",

      measurementId: "G-B12LL33EQ3"

    };


    /* Initialize Firebase */

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    /* Elements */

    const email =
      document.getElementById("email");

    const password =
      document.getElementById("password");

    const loginBtn =
      document.getElementById("loginBtn");

    const signupBtn =
      document.getElementById("signupBtn");

    const message =
      document.getElementById("message");


    /*
      Get redirect destination.

      Example:

      login.html?redirect=album.html?album=dream

      After login:
      album.html?album=dream
    */

    const params =
      new URLSearchParams(window.location.search);

    const redirect =
      params.get("redirect");


    /* ================= LOGIN ================= */

    loginBtn.addEventListener("click", async () => {

      const userEmail =
        email.value.trim();

      const userPassword =
        password.value;


      /* Check empty fields */

      if (!userEmail || !userPassword) {

        message.textContent =
          "Please enter your email and password.";

        message.style.color =
          "#f87171";

        return;
      }


      loginBtn.disabled = true;

      message.textContent =
        "Logging in...";

      message.style.color =
        "#a78bfa";


      try {

        await signInWithEmailAndPassword(
          auth,
          userEmail,
          userPassword
        );


        message.textContent =
          "✓ Login successful!";

        message.style.color =
          "#4ade80";


        /*
          If user came from Gallery/Album,
          go back there.

          Otherwise go to index.html.
        */

        setTimeout(() => {

          if (redirect) {

            window.location.href =
              redirect;

          } else {

            window.location.href =
              "index.html";

          }

        }, 700);


      } catch (error) {

        console.error(error);

        message.style.color =
          "#f87171";


        if (
          error.code ===
          "auth/invalid-credential"
        ) {

          message.textContent =
            "Incorrect email or password.";

        } else if (
          error.code ===
          "auth/invalid-email"
        ) {

          message.textContent =
            "Please enter a valid email address.";

        } else {

          message.textContent =
            error.message;

        }


        loginBtn.disabled = false;

      }

    });


    /* ================= CREATE ACCOUNT ================= */

    signupBtn.addEventListener("click", () => {

      /*
        Keep the redirect information
        when going to signup page.
      */

      const query =
        window.location.search;

      window.location.href =
        "signup.html" + query;

    });

  </script>

</body>
</html>
