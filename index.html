<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ceylon Luxe Escapes | Discover Sri Lanka</title>

<meta name="description" content="Discover Sri Lanka with Ceylon Luxe Escapes. Private tours, luxury travel, wildlife, beaches and unforgettable journeys.">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#07110f;
  color:#fff;
  line-height:1.6;
}

header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:1000;
  background:rgba(5,15,13,.65);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.12);
}

nav{
  max-width:1200px;
  margin:auto;
  padding:18px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  color:#fff;
  font-size:22px;
  font-weight:700;
  letter-spacing:1px;
}

.logo span{
  color:#d7b46a;
}

.nav-links{
  display:flex;
  gap:28px;
}

.nav-links a{
  color:#fff;
  text-decoration:none;
  font-size:14px;
  transition:.3s;
}

.nav-links a:hover{
  color:#d7b46a;
}

.menu-btn{
  display:none;
  font-size:28px;
  cursor:pointer;
}

/* HERO */

.hero{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:120px 20px 80px;

  background:
    linear-gradient(rgba(3,15,12,.48),rgba(3,15,12,.78)),
    url("https://images.unsplash.com/photo-1588598198321-9735fd524ba6?auto=format&fit=crop&w=2000&q=85");

  background-size:cover;
  background-position:center;
}

.hero-content{
  max-width:900px;
}

.hero-small{
  color:#d7b46a;
  text-transform:uppercase;
  letter-spacing:4px;
  font-size:13px;
  margin-bottom:18px;
}

.hero h1{
  font-size:clamp(48px,8vw,88px);
  line-height:1.05;
  margin-bottom:25px;
}

.hero h1 span{
  color:#d7b46a;
}

.hero p{
  max-width:700px;
  margin:auto;
  color:#e0e6e3;
  font-size:18px;
}

.buttons{
  margin-top:35px;
}

.btn{
  display:inline-block;
  padding:14px 28px;
  margin:6px;
  border-radius:30px;
  text-decoration:none;
  font-weight:bold;
  transition:.3s;
}

.btn-primary{
  background:#d7b46a;
  color:#07110f;
}

.btn-primary:hover{
  transform:translateY(-3px);
  background:#ebcf91;
}

.btn-outline{
  border:1px solid rgba(255,255,255,.6);
  color:#fff;
}

.btn-outline:hover{
  background:#fff;
  color:#07110f;
}

/* GENERAL */

section{
  max-width:1200px;
  margin:auto;
  padding:100px 25px;
}

.section-label{
  color:#d7b46a;
  text-transform:uppercase;
  letter-spacing:3px;
  font-size:12px;
  margin-bottom:10px;
}

.section-title{
  font-size:clamp(32px,5vw,52px);
  margin-bottom:20px;
}

.section-text{
  max-width:720px;
  color:#aebbb6;
  font-size:17px;
}

/* JOURNEYS */

.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
  margin-top:45px;
}

.card{
  background:#0d1b17;
  border:1px solid #20332d;
  border-radius:20px;
  overflow:hidden;
  transition:.35s;
}

.card:hover{
  transform:translateY(-8px);
  border-color:#d7b46a;
}

.card-img{
  height:240px;
  overflow:hidden;
}

.card-img img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:.5s;
}

.card:hover img{
  transform:scale(1.07);
}

.card-content{
  padding:25px;
}

.card-content h3{
  font-size:23px;
  margin-bottom:8px;
}

.card-content p{
  color:#9eaaa5;
  font-size:15px;
}

/* DESTINATIONS */

.destinations{
  background:#0a1714;
}

.destination-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
  margin-top:40px;
}

.destination{
  min-height:250px;
  border-radius:18px;
  overflow:hidden;
  position:relative;
  display:flex;
  align-items:flex-end;
  padding:25px;
  background-size:cover;
  background-position:center;
}

.destination::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(transparent,rgba(0,0,0,.8));
}

.destination div{
  position:relative;
  z-index:2;
}

.destination h3{
  font-size:25px;
}

.destination p{
  color:#ddd;
  font-size:14px;
}

/* WHY US */

.features{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  margin-top:45px;
}

.feature{
  padding:28px;
  background:#0d1b17;
  border-radius:18px;
  border:1px solid #20332d;
}

.feature-icon{
  font-size:32px;
  margin-bottom:15px;
}

.feature h3{
  margin-bottom:8px;
}

.feature p{
  color:#9eaaa5;
  font-size:14px;
}

/* CTA */

.cta{
  max-width:1200px;
  margin:50px auto 100px;
  padding:90px 25px;
  border-radius:28px;
  text-align:center;

  background:
    linear-gradient(rgba(4,17,14,.55),rgba(4,17,14,.8)),
    url("https://images.unsplash.com/photo-154
