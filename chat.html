
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Submission</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: #080b12;
  font-family: Arial, sans-serif;
  color: white;
}

.container {
  width: 100%;
  max-width: 390px;
  padding: 30px 25px;
  border: 1px solid #263849;
  border-radius: 18px;
  background: #111925;
  box-shadow: 0 0 30px #00e5ff18;
}

h2 {
  text-align: center;
  color: #39ff88;
  margin-bottom: 10px;
}

.subtitle {
  text-align: center;
  color: #aab7c5;
  font-size: 13px;
  margin-bottom: 25px;
}

label {
  display: block;
  margin: 17px 0 8px;
  font-size: 14px;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #35475a;
  border-radius: 9px;
  background: #080e17;
  color: white;
  font-size: 15px;
  outline: none;
}

input:focus {
  border-color: #00e5ff;
}

button {
  width: 100%;
  margin-top: 23px;
  padding: 14px;
  border: none;
  border-radius: 9px;
  background: linear-gradient(90deg,#39ff88,#00e5ff);
  color: #071019;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
}

#message {
  text-align: center;
  font-size: 14px;
  margin-top: 18px;
  overflow-wrap: anywhere;
}

.note {
  color: #aab7c5;
  font-size: 11px;
  line-height: 1.5;
  margin-top: 14px;
}
</style>
</head>

<body>

<div class="container">

  <h2>Welcome</h2>
  <p class="subtitle">Data Submission Portal</p>

  <form id="submissionForm">

    <label>Username / Email / Mobile Number</label>
    <input
      type="text"
      id="username"
      placeholder="Enter username, email or mobile"
      maxlength="150"
      required
    >

    <label>Demo Reference Code</label>
    <input
      type="text"
      id="demoCode"
      placeholder="Enter demo reference code"
      maxlength="100"
      required
    >

    <p class="note">
      Enter a non-sensitive demo reference code only.
      Never enter a real account password.
    </p>

    <button type="submit" id="submitBtn">
      Submit
    </button>

    <p id="message" role="status"></p>

  </form>
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCpZw11RVkWAYlGsuLIemhufgPFGxWeoNc",
  authDomain: "login-data-2e0b1.firebaseapp.com",
  projectId: "login-data-2e0b1",
  storageBucket: "login-data-2e0b1.firebasestorage.app",
  messagingSenderId: "21440446512",
  appId: "1:40446512:web:e73ece526bf4053fea6df5"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const form = document.getElementById("submissionForm");
const button = document.getElementById("submitBtn");
const message = document.getElementById("message");

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const username =
    document.getElementById("username").value.trim();

  const demoCode =
    document.getElementById("demoCode").value.trim();

  if (!username || !demoCode) {
    message.textContent = "Please complete both fields.";
    return;
  }

  button.disabled = true;
  message.textContent = "Submitting...";

  try {
    await addDoc(collection(db, "submissions"), {
      username: username,
      demoReferenceCode: demoCode,
      createdAt: serverTimestamp()
    });

    message.textContent = "Submitted successfully!";
    message.style.color = "#39ff88";
    form.reset();

  } catch (error) {
    console.error(error);
    message.textContent = "Submission failed. Please check Firebase Rules.";
    message.style.color = "#ff7070";
  }

  button.disabled = false;
});

</script>

</body>
</html>
