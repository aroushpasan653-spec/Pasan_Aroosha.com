
<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05080d">
  <title>PAZZAN.COM | Live Chat</title>

  <style>
    :root {
      --green: #39ff88;
      --cyan: #00e5ff;
      --bg: #05080d;
      --muted: #aab9c8;
      --line: #39ff8840;
      --glass: rgba(10, 20, 30, .76);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: #f3fff9;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(ellipse at 0 0, #123b3150, transparent 45%),
        radial-gradient(ellipse at 100% 100%, #35135c55, transparent 45%),
        var(--bg);
      background-attachment: fixed;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5%;
      gap: 10px;
      background: #05080dcc;
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--line);
    }

    .logo {
      color: var(--green);
      font-weight: 900;
      font-size: 21px;
      text-decoration: none;
      letter-spacing: 1px;
    }

    .logo span { color: var(--cyan); }

    .btn {
      color: white;
      background: #ffffff0a;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 13px;
    }

    .btn:hover { border-color: var(--cyan); }

    .page {
      max-width: 1200px;
      margin: 24px auto;
      padding: 0 14px;
    }

    .layout {
      min-height: 78vh;
      display: grid;
      grid-template-columns: 290px minmax(0, 1fr);
      border: 1px solid var(--line);
      border-radius: 20px;
      overflow: hidden;
      background: var(--glass);
      backdrop-filter: blur(20px);
      box-shadow: 0 0 35px #00e5ff0b;
    }

    .sidebar {
      min-width: 0;
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
    }

    .side-head { padding: 20px 16px 12px; }

    h2 {
      color: var(--green);
      font-size: 21px;
      margin: 0 0 8px;
    }

    .muted {
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .search {
      width: calc(100% - 28px);
      margin: 0 14px 12px;
      padding: 12px;
      color: white;
      background: #ffffff08;
      border: 1px solid #ffffff20;
      border-radius: 10px;
      outline: none;
    }

    .search:focus { border-color: var(--cyan); }

    .friend-list {
      flex: 1;
      overflow-y: auto;
    }

    .friend {
      width: 100%;
      display: flex;
      gap: 11px;
      align-items: center;
      padding: 14px;
      color: white;
      text-align: left;
      border: 0;
      border-top: 1px solid #ffffff0c;
      background: transparent;
    }

    .friend:hover, .friend.active {
      background: #39ff8810;
    }

    .friend.active {
      box-shadow: inset 3px 0 var(--green);
    }

    .avatar {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--green);
      font-weight: bold;
      border: 1px solid #39ff8870;
      background: #39ff8810;
    }

    .friend-info { min-width: 0; }
    .friend-name { font-size: 14px; overflow-wrap: anywhere; }
    .friend-status { color: var(--green); font-size: 11px; margin-top: 5px; }

    .chat {
      display: flex;
      min-width: 0;
      min-height: 0;
      flex-direction: column;
    }

    .chat-head {
      min-height: 72px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 18px;
      border-bottom: 1px solid #ffffff15;
    }

    .chat-head h3 {
      font-size: 15px;
      margin: 0 0 5px;
      overflow-wrap: anywhere;
    }

    .chat-head .muted { font-size: 11px; }

    .messages {
      flex: 1;
      min-height: 300px;
      max-height: 58vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 20px 16px;
    }

    .empty {
      margin: auto;
      padding: 25px 15px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
    }

    .bubble {
      max-width: 82%;
      width: fit-content;
      padding: 11px 13px;
      border: 1px solid #ffffff15;
      background: #ffffff0a;
      border-radius: 15px 15px 15px 4px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      line-height: 1.5;
      font-size: 14px;
    }

    .bubble.mine {
      align-self: flex-end;
      background: #39ff8815;
      border-color: #39ff8840;
      border-radius: 15px 15px 4px 15px;
    }

    .bubble .time {
      display: block;
      margin-top: 6px;
      font-size: 10px;
      color: var(--muted);
      text-align: right;
    }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 9px;
      padding: 13px;
      border-top: 1px solid #ffffff15;
    }

    .composer input {
      flex: 1;
      min-width: 0;
      color: white;
      padding: 13px;
      border-radius: 12px;
      border: 1px solid #ffffff20;
      background: #ffffff08;
      outline: none;
    }

    .composer input:focus { border-color: var(--green); }

    .send {
      border: none;
      border-radius: 12px;
      padding: 13px 17px;
      font-weight: bold;
      color: #04100b;
      background: linear-gradient(100deg, var(--green), var(--cyan));
    }

    .send:disabled { opacity: .5; cursor: not-allowed; }

    .status {
      margin: 12px 15px;
      padding: 10px;
      font-size: 12px;
      line-height: 1.6;
      border-radius: 9px;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .status.error {
      color: #ffb6bd;
      background: #ff315515;
      border: 1px solid #ff315540;
    }

    .status.ok {
      color: var(--green);
      background: #39ff880b;
    }

    .hidden { display: none !important; }

    @media (max-width: 700px) {
      .page { margin: 12px auto; padding: 0 8px; }

      .layout {
        grid-template-columns: 1fr;
        min-height: 82vh;
      }

      .sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .side-head { padding: 15px 14px 9px; }
      .side-head h2 { font-size: 18px; }

      .friend-list {
        display: flex;
        overflow-x: auto;
        flex: initial;
        padding-bottom: 8px;
      }

      .friend {
        flex: 0 0 145px;
        width: 145px;
        flex-direction: column;
        align-items: flex-start;
        border: 0;
        border-right: 1px solid #ffffff0c;
        gap: 7px;
      }

      .friend.active { box-shadow: inset 0 -3px var(--green); }

      .messages {
        min-height: 300px;
        max-height: none;
      }

      .chat { min-height: 55vh; }
      .bubble { max-width: 90%; }
      .logo { font-size: 17px; }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <a class="logo" href="index.html">PAZZAN<span>.COM</span></a>
    <div style="display:flex;gap:8px">
      <a class="btn" href="index.html" style="text-decoration:none">Home</a>
      <button class="btn" id="logoutBtn" type="button">Logout</button>
    </div>
  </header>

  <main class="page">
    <div class="layout">
      <aside class="sidebar">
        <div class="side-head">
          <h2>Live Chat</h2>
          <p class="muted" id="myEmail">සම්බන්ධ වෙමින්...</p>
        </div>

        <input
          id="search"
          class="search"
          type="search"
          placeholder="යාළුවන් සොයන්න..."
          aria-label="Search friends"
        >

        <div id="friendList" class="friend-list">
          <div class="empty">යාළුවන්ගේ ලැයිස්තුව ලබාගනිමින්...</div>
        </div>

        <div id="friendStatus" class="status">
          සම්බන්ධ වෙමින්...
        </div>
      </aside>

      <section class="chat">
        <div class="chat-head">
          <div class="avatar" id="chatAvatar">P</div>
          <div>
            <h3 id="chatName">යාළුවෙක් තෝරන්න</h3>
            <p class="muted" id="chatSubtitle">
              පණිවිඩ යැවීමට අනුමත යාළුවෙක් තෝරන්න
            </p>
          </div>
        </div>

        <div id="messages" class="messages">
          <div class="empty">
            💬 PAZZAN Live Chat<br>
            වම් පැත්තේ ලැයිස්තුවෙන් යාළුවෙක් තෝරන්න.
          </div>
        </div>

        <form id="composer" class="composer">
          <input
            id="messageInput"
            type="text"
            maxlength="2000"
            placeholder="පණිවිඩයක් ලියන්න..."
            autocomplete="off"
            disabled
            required
          >
          <button id="sendBtn" class="send" type="submit" disabled>
            Send
          </button>
        </form>
      </section>
    </div>
  </main>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      query,
      where,
      getDocs,
      getDoc,
      doc,
      setDoc,
      addDoc,
      onSnapshot,
      orderBy,
      limit,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

    // ඔයා ලබාදුන් Firebase configuration එක
    const firebaseConfig = {
      apiKey: "AIzaSyB3G98XBTZH6NFiZx6NQmyEKR8g6vnSYNQ",
      authDomain: "pasan-fc8e2.firebaseapp.com",
      projectId: "pasan-fc8e2",
      storageBucket: "pasan-fc8e2.firebasestorage.app",
      messagingSenderId: "330282693990",
      appId: "1:330282693990:web:f754a4a09efaa73ab5c4a7",
      measurementId: "G-B12LL33EQ3"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const $ = id => document.getElementById(id);

    let currentUser = null;
    let friends = [];
    let selectedFriend = null;
    let unsubscribeMessages = null;
    let unsubscribeFriends = null;
    let selecting = false;

    function showStatus(text, type = "") {
      $("friendStatus").textContent = text;
      $("friendStatus").className = "status" + (type ? " " + type : "");
    }

    function showError(error, area = "friendStatus") {
      console.error("PAZZAN Chat:", error);
      const el = $(area);

      if (area === "friendStatus") {
        showStatus(
          error.code === "permission-denied"
            ? "ප්‍රවේශ අවසර නැහැ. Firestore Security Rules පරීක්ෂා කරන්න."
            : error.code === "unavailable"
              ? "Internet හෝ Firebase සම්බන්ධතාව පරීක්ෂා කරන්න."
              : "දෝෂය: " + (error.code || error.message),
          "error"
        );
      } else {
        el.textContent = "පණිවිඩ ලබාගැනීමට නොහැකි වුණා: " +
          (error.code || error.message);
        el.className = "empty";
      }
    }

    function escapeText(text) {
      return String(text ?? "");
    }

    function initials(name) {
      return (name || "?").trim().charAt(0).toUpperCase() || "?";
    }

    function getFriendName(friend) {
      return friend.name || friend.displayName ||
        friend.email || friend.uid || "Friend";
    }

    function renderFriends() {
      const term = $("search").value.trim().toLowerCase();
      const list = $("friendList");
      list.replaceChildren();

      const visible = friends.filter(friend =>
        getFriendName(friend).toLowerCase().includes(term)
      );

      if (!visible.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = friends.length
          ? "ගැළපෙන යාළුවෙක් නැහැ."
          : "අනුමත යාළුවන් හමු වුණේ නැහැ.";
        list.appendChild(empty);
        return;
      }

      visible.forEach(friend => {
        const item = document.createElement("button");
        item.type = "button";
        item.className = "friend" +
          (selectedFriend?.uid === friend.uid ? " active" : "");

        const avatar = document.createElement("span");
        avatar.className = "avatar";
        avatar.textContent = initials(getFriendName(friend));

        const info = document.createElement("span");
        info.className = "friend-info";

        const name = document.createElement("span");
        name.className = "friend-name";
        name.textContent = getFriendName(friend);

        const status = document.createElement("span");
        status.className = "friend-status";
        status.textContent = "✓ අනුමත යාළුවෙක්";

        info.append(name, status);
        item.append(avatar, info);

        item.addEventListener("click", () => selectFriend(friend));
        list.appendChild(item);
      });
    }

    /*
      Friend document schema expected:
      friend/{documentId}
      {
        members: ["uid_1", "uid_2"],
        status: "approved"
      }

      Security Rules must allow only the appropriate members
      to read approved friend documents.
    */
    async function loadFriends() {
      showStatus("අනුමත යාළුවන් සොයමින්...");

      try {
        const friendQuery = query(
          collection(db, "friend"),
          where("members", "array-contains", currentUser.uid),
          where("status", "==", "approved")
        );

        const snapshot = await getDocs(friendQuery);
        const results = [];

        for (const item of snapshot.docs) {
          const data = item.data();
          const members = data.members || [];

          const otherUid = members.find(
            uid => uid !== currentUser.uid
          );

          if (!otherUid) continue;

          let name = "";
          let email = "";

          try {
            const userDoc = await getDoc(doc(db, "users", otherUid));

            if (userDoc.exists()) {
              const profile = userDoc.data();
              name = profile.displayName || profile.name || "";
              email = profile.email || "";
            }
          } catch (profileError) {
            // Profile reading is optional; use UID if unavailable.
            console.warn("Optional friend profile unavailable.");
          }

          results.push({
            uid: otherUid,
            name,
            email,
            friendshipId: item.id
          });
        }

        friends = results;
        renderFriends();
        showStatus(
          friends.length
            ? friends.length + " අනුමත යාළුවෙක් හමු වුණා."
            : "දැනට අනුමත යාළුවන් නැහැ."
        );

        // If a friend was removed from the approved list,
        // stop displaying that conversation.
        if (selectedFriend &&
            !friends.some(f => f.uid === selectedFriend.uid)) {
          clearSelectedFriend();
        }

      } catch (error) {
        showError(error);
      }
    }

    function clearSelectedFriend() {
      if (unsubscribeMessages) unsubscribeMessages();
      unsubscribeMessages = null;
      selectedFriend = null;
      $("chatName").textContent = "යාළුවෙක් තෝරන්න";
      $("chatAvatar").textContent = "P";
      $("chatSubtitle").textContent = "අනුමත යාළුවෙක් තෝරන්න";
      $("messageInput").disabled = true;
      $("sendBtn").disabled = true;
      $("messages").replaceChildren();

      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "💬 පණිවිඩ බැලීමට යාළුවෙක් තෝරන්න.";
      $("messages").appendChild(empty);

      renderFriends();
    }

    async function selectFriend(friend) {
      if (selecting) return;
      selecting = true;

      try {
        if (unsubscribeMessages) unsubscribeMessages();
        unsubscribeMessages = null;

        selectedFriend = friend;
        renderFriends();

        $("chatName").textContent = getFriendName(friend);
        $("chatAvatar").textContent = initials(getFriendName(friend));
        $("chatSubtitle").textContent = "Live Chat";
        $("messageInput").disabled = true;
        $("sendBtn").disabled = true;
        $("messages").replaceChildren();

        const loading = document.createElement("div");
        loading.className = "empty";
        loading.textContent = "පණිවිඩ ලබාගනිමින්...";
        $("messages").appendChild(loading);

        const ids = [currentUser.uid, friend.uid].sort();
        const chatId = ids.join("_");
        const chatRef = doc(db, "chats", chatId);

        // A chat may only be initialized for an approved friend.
        // Firestore Rules must enforce the same requirement.
        await setDoc(chatRef, {
          members: ids,
          updatedAt: serverTimestamp()
        }, { merge: true });

        if (selectedFriend?.uid !== friend.uid) return;

        const messagesQuery = query(
          collection(db, "chats", chatId, "messages"),
          orderBy("createdAt", "asc"),
          limit(100)
        );

        unsubscribeMessages = onSnapshot(
          messagesQuery,
          snapshot => {
            if (selectedFriend?.uid !== friend.uid) return;

            const container = $("messages");
            container.replaceChildren();

            if (snapshot.empty) {
              const empty = document.createElement("div");
              empty.className = "empty";
              empty.textContent =
                "තවම පණිවිඩ නැහැ. පළමු පණිවිඩය යවන්න!";
              container.appendChild(empty);
            }

            snapshot.forEach(messageDoc => {
              const data = messageDoc.data();
              const bubble = document.createElement("div");

              bubble.className = "bubble" +
                (data.senderId === currentUser.uid ? " mine" : "");

              const text = document.createElement("div");
              text.textContent = escapeText(data.text);
              bubble.appendChild(text);

              const time = document.createElement("span");
              time.className = "time";

              const date = data.createdAt?.toDate?.();
              time.textContent = date
                ? date.toLocaleTimeString([], {
                    hour: "2-digit",
                    minute: "2-digit"
                  })
                : "යවමින්...";

              bubble.appendChild(time);
              container.appendChild(bubble);
            });

            container.scrollTop = container.scrollHeight;
            $("messageInput").disabled = false;
            $("sendBtn").disabled = false;
          },
          error => showError(error, "messages")
        );

      } catch (error) {
        showError(error);
        $("messages").replaceChildren();

        const errorBox = document.createElement("div");
        errorBox.className = "empty";
        errorBox.textContent =
          "Chat විවෘත කළ නොහැක. Friendship සහ Firestore Rules පරීක්ෂා කරන්න.";
        $("messages").appendChild(errorBox);

      } finally {
        selecting = false;
      }
    }

    $("composer").addEventListener("submit", async event => {
      event.preventDefault();

      const text = $("messageInput").value.trim();

      if (!text || !selectedFriend || !currentUser) return;

      const friend = selectedFriend;
      const ids = [currentUser.uid, friend.uid].sort();
      const chatId = ids.join("_");
      const chatRef = doc(db, "chats", chatId);
      const sendBtn = $("sendBtn");

      sendBtn.disabled = true;

      try {
        // Recheck that this friend is still approved before sending.
        const friendQuery = query(
          collection(db, "friend"),
          where("members", "array-contains", currentUser.uid),
          where("status", "==", "approved")
        );

        const approvedSnapshot = await getDocs(friendQuery);
        const isApproved = approvedSnapshot.docs.some(item =>
          (item.data().members || []).includes(friend.uid)
        );

        if (!isApproved) {
          throw new Error("මෙම යාළුවා සමඟ Chat කිරීමට අවසර නැහැ.");
        }

        // Firestore Rules must independently enforce membership.
        const value = text;
        $("messageInput").value = "";

        await addDoc(collection(db, "chats", chatId, "messages"), {
          senderId: currentUser.uid,
          text: value,
          createdAt: serverTimestamp()
        });

        await setDoc(chatRef, {
          members: ids,
          updatedAt: serverTimestamp()
        }, { merge: true });

      } catch (error) {
        console.error("Message sending failed:", error);
        $("messageInput").value = text;

        showStatus(
          error.code === "permission-denied"
            ? "පණිවිඩ යැවීමට අවසර නැහැ. Firestore Rules පරීක්ෂා කරන්න."
            : error.message || "පණිවිඩය යැවීමට නොහැකි වුණා.",
          "error"
        );
      } finally {
        sendBtn.disabled = !selectedFriend;
      }
    });

    $("search").addEventListener("input", renderFriends);

    $("logoutBtn").addEventListener("click", async () => {
      try {
        if (unsubscribeMessages) unsubscribeMessages();
        if (unsubscribeFriends) unsubscribeFriends();

        await signOut(auth);
        alert("You have been logged out.");
        window.location.assign("login.html");
      } catch (error) {
        showStatus("Logout කිරීමට නොහැකි වුණා.", "error");
        console.error(error);
      }
    });

    onAuthStateChanged(auth, async user => {
      if (!user) {
        window.location.replace("login.html");
        return;
      }

      currentUser = user;
      $("myEmail").textContent = user.email || "Logged in";
      await loadFriends();
    });
  </script>
</body>
</html>
