
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PAZZAN.COM | Private Chat</title>

<style>
:root {
  --green:#39ff88;
  --cyan:#00e5ff;
  --text:#effff8;
  --muted:#9db3c0;
  --line:rgba(57,255,136,.22);
  --glass:rgba(8,20,29,.68);
}
* { box-sizing:border-box; }
body {
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:Arial,sans-serif;
  background:
    radial-gradient(ellipse at 10% 0%,#124d3b 0,transparent 38%),
    radial-gradient(ellipse at 95% 80%,#102f58 0,transparent 40%),
    #04070c;
  background-attachment:fixed;
}
button,input { font:inherit; }
button { cursor:pointer; color:var(--text); }
header {
  position:sticky; top:0; z-index:10;
  min-height:68px; padding:13px 5%;
  display:flex; align-items:center; justify-content:space-between;
  gap:12px;
  background:rgba(3,8,13,.68);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(22px) saturate(150%);
}
.logo {
  color:var(--green); text-decoration:none;
  font-size:21px; font-weight:900; letter-spacing:1px;
  text-shadow:0 0 15px #39ff8866;
}
.btn {
  border:1px solid var(--line);
  border-radius:12px; padding:11px 15px;
  background:rgba(57,255,136,.08);
  transition:.2s;
}
.btn:hover { border-color:var(--green); box-shadow:0 0 16px #39ff8820; }
.app {
  width:min(1150px,95%);
  margin:24px auto;
  display:grid;
  grid-template-columns:290px minmax(0,1fr);
  gap:17px;
}
.glass {
  min-width:0;
  border:1px solid var(--line);
  border-radius:20px;
  overflow:hidden;
  background:var(--glass);
  backdrop-filter:blur(22px) saturate(140%);
  box-shadow:0 12px 45px #0005, inset 0 1px #ffffff08;
}
.section-head,.chat-head {
  padding:18px;
  border-bottom:1px solid var(--line);
}
h2 { margin:0 0 6px; font-size:18px; }
.muted { color:var(--muted); font-size:12px; }
#friends {
  padding:10px; max-height:68vh; overflow:auto;
}
.friend {
  width:100%; display:flex; align-items:center; gap:11px;
  padding:12px; margin-bottom:7px;
  text-align:left; border-radius:14px;
  border:1px solid transparent;
  background:rgba(255,255,255,.025);
}
.friend:hover,.friend.active {
  border-color:var(--line);
  background:rgba(57,255,136,.08);
}
.avatar {
  width:41px;height:41px;flex-shrink:0;
  display:grid;place-items:center;border-radius:50%;
  border:1px solid var(--line);
  background:rgba(57,255,136,.10);
  color:var(--green);font-weight:bold;
}
.name { font-weight:bold; overflow-wrap:anywhere; }
.friend-status { display:flex;align-items:center;gap:5px;margin-top:5px; }
.dot {
  display:inline-block;width:7px;height:7px;border-radius:50%;
  background:#64727d;
}
.dot.online { background:var(--green);box-shadow:0 0 8px var(--green); }
.chat { display:flex;flex-direction:column;min-height:570px; }
.chat-head { display:flex;align-items:center;justify-content:space-between;gap:12px; }
#messages {
  flex:1;min-height:330px;max-height:56vh;overflow:auto;
  display:flex;flex-direction:column;gap:12px;padding:18px;
}
.bubble {
  max-width:83%;align-self:flex-start;
  padding:11px 13px;border-radius:15px 15px 15px 4px;
  background:rgba(255,255,255,.065);
  border:1px solid rgba(255,255,255,.08);
  white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45;
}
.bubble.mine {
  align-self:flex-end;
  border-color:var(--line);
  background:rgba(57,255,136,.10);
  border-radius:15px 15px 4px 15px;
}
.meta {
  display:block;text-align:right;margin-top:6px;
  font-size:10px;color:var(--muted);
}
#typing { min-height:20px;padding:0 18px;color:var(--cyan);font-size:12px; }
.composer {
  display:flex;gap:9px;padding:13px;
  border-top:1px solid var(--line);
  background:rgba(0,0,0,.10);
}
#message {
  min-width:0;flex:1;color:var(--text);
  background:rgba(0,0,0,.22);
  border:1px solid var(--line);border-radius:13px;
  padding:13px;outline:none;
}
#message:focus { border-color:var(--cyan);box-shadow:0 0 12px #00e5ff18; }
#send { color:var(--green);font-weight:bold; }
#notice { padding:0 16px 12px;color:var(--muted);font-size:12px;overflow-wrap:anywhere; }
.empty { margin:auto;padding:25px;text-align:center;color:var(--muted);line-height:1.6; }
@media(max-width:720px) {
  .app { grid-template-columns:1fr;margin:12px auto; }
  #friends { display:flex;gap:8px;max-height:none;overflow-x:auto; }
  .friend { min-width:175px;width:175px;margin:0; }
  .chat { min-height:480px; }
  #messages { min-height:280px;max-height:48vh; }
  header { padding:12px 4%; }
}
</style>
</head>

<body>
<header>
  <a class="logo" href="index.html">PAZZAN.COM</a>
  <button class="btn" id="logout">Log out</button>
</header>

<main class="app">
  <aside class="glass">
    <div class="section-head">
      <h2>Friends</h2>
      <div class="muted">Your approved chat contacts</div>
    </div>
    <div id="friends"><div class="empty">Loading friends...</div></div>
  </aside>

  <section class="glass chat">
    <div class="chat-head">
      <div>
        <h2 id="chatName">Private Chat</h2>
        <div class="muted" id="chatStatus">Choose a friend</div>
      </div>
      <button class="btn" id="notify">Enable alerts</button>
    </div>

    <div id="messages">
      <div class="empty">Choose a friend to start chatting.</div>
    </div>
    <div id="typing"></div>

    <form class="composer" id="composer">
      <input id="message" maxlength="2000"
        placeholder="Type a message..." autocomplete="off" disabled>
      <button class="btn" id="send" type="submit" disabled>Send</button>
    </form>
    <div id="notice" role="status" aria-live="polite"></div>
  </section>
</main>

<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
  getAuth,onAuthStateChanged,signOut
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

import {
  getFirestore,collection,doc,getDoc,getDocs,query,where,
  orderBy,limit,onSnapshot,setDoc,addDoc,serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB3G98XBTZH6NFiZx6NQmyEKR8g6vnSYNQ",
  authDomain: "pasan-fc8e2.firebaseapp.com",
  projectId: "pasan-fc8e2",
  storageBucket: "pasan-fc8e2.firebasestorage.app",
  messagingSenderId: "330282693990",
  appId: "1:330282693990:web:f754a4a09efaa73ab5c4a7",
  measurementId: "G-B12LL33EQ3"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);

let me = null;
let selected = null;
let chatId = null;
let stopMessages = null;
let stopTyping = null;
let stopPresence = null;
let stopReceipt = null;
let typingTimer = null;
let presenceTimer = null;
let typingWriteTimer = null;
let isTyping = false;
let sending = false;
let firstMessageSnapshot = true;
let lastSeenMessageIds = new Set();
let presenceCache = {};
let receiptCache = {};

function say(text) { $("notice").textContent = text; }

function report(error) {
  console.error(error);
  say(error.code === "permission-denied"
    ? "Permission denied. Check the Firestore Rules and approved friend documents."
    : (error.message || "Something went wrong."));
}

function chatKey(a,b) { return [a,b].sort().join("_"); }

function stopListeners() {
  [stopMessages,stopTyping,stopPresence,stopReceipt].forEach(fn => {
    if (fn) fn();
  });
  stopMessages = stopTyping = stopPresence = stopReceipt = null;
  clearTimeout(typingTimer);
  clearTimeout(typingWriteTimer);
  selected = null;
  chatId = null;
  isTyping = false;
  $("message").disabled = true;
  $("send").disabled = true;
  $("typing").textContent = "";
}

function approvedDoc(uid) {
  return getDoc(doc(db,"friend",uid));
}

async function writeTyping(value, targetChat = chatId) {
  if (!me || !targetChat) return;
  try {
    await setDoc(doc(db,"chats",targetChat,"typing",me.uid), {
      typing:value,
      updatedAt:serverTimestamp()
    });
  } catch (error) {
    report(error);
  }
}

async function loadFriends() {
  $("friends").replaceChildren();
  const waiting = document.createElement("div");
  waiting.className = "empty";
  waiting.textContent = "Loading friends...";
  $("friends").append(waiting);

  try {
    const q = query(collection(db,"friend"),where("enabled","==",true));
    const snapshot = await getDocs(q);
    $("friends").replaceChildren();
    let count = 0;

    for (const item of snapshot.docs) {
      if (item.id === me.uid) continue;
      count++;

      const data = item.data();
      const person = {
        uid:item.id,
        name:data.name || "Friend",
        email:data.email || ""
      };

      const button = document.createElement("button");
      button.type = "button";
      button.className = "friend";

      const avatar = document.createElement("span");
      avatar.className = "avatar";
      avatar.textContent = person.name.charAt(0).toUpperCase();

      const details = document.createElement("span");
      const name = document.createElement("div");
      name.className = "name";
      name.textContent = person.name;

      const status = document.createElement("div");
      status.className = "friend-status muted";

      const dot = document.createElement("span");
      dot.className = "dot";
      dot.id = "dot-" + person.uid;

      const statusText = document.createElement("span");
      statusText.id = "status-" + person.uid;
      statusText.textContent = "Offline";

      status.append(dot,statusText);
      details.append(name,status);
      button.append(avatar,details);

      button.addEventListener("click",() => openChat(person,button));
      $("friends").append(button);

      // Listen to this friend's presence document.
      onSnapshot(doc(db,"presence",person.uid), snap => {
        const data = snap.exists() ? snap.data() : {};
        const fresh = data.online === true &&
          data.updatedAt?.toDate &&
          Date.now() - data.updatedAt.toDate().getTime() < 70000;

        presenceCache[person.uid] = fresh;
        const dotEl = $("dot-" + person.uid);
        const statusEl = $("status-" + person.uid);
        if (dotEl) dotEl.classList.toggle("online",fresh);
        if (statusEl) statusEl.textContent = fresh ? "Online" : "Offline";
      },error => console.warn("Presence:",error.code));
    }

    if (!count) {
      $("friends").innerHTML =
        '<div class="empty">No approved friends found.<br>Check the friend documents.</div>';
    }
  } catch (error) {
    report(error);
    $("friends").innerHTML =
      '<div class="empty">Could not load friends.</div>';
  }
}

async function openChat(person,button) {
  stopListeners();
  document.querySelectorAll(".friend").forEach(el => el.classList.remove("active"));
  button.classList.add("active");

  selected = person;
  const thisChat = chatKey(me.uid,person.uid);
  chatId = thisChat;
  firstMessageSnapshot = true;
  lastSeenMessageIds = new Set();

  $("chatName").textContent = person.name;
  $("chatStatus").textContent = "Connecting...";
  $("messages").replaceChildren();
  $("typing").textContent = "";
  $("message").disabled = true;
  $("send").disabled = true;
  say("");

  try {
    const [mine,theirs] = await Promise.all([
      approvedDoc(me.uid),approvedDoc(person.uid)
    ]);

    if (!mine.exists() || mine.data().enabled !== true ||
        !theirs.exists() || theirs.data().enabled !== true) {
      throw new Error("This account is not approved for chat.");
    }

    const chatRef = doc(db,"chats",thisChat);
    const existing = await getDoc(chatRef);

    if (chatId !== thisChat) return;

    if (!existing.exists()) {
      await setDoc(chatRef,{
        participants:[me.uid,person.uid].sort(),
        createdAt:serverTimestamp()
      });
    } else {
      const p = existing.data().participants;
      if (!Array.isArray(p) || p.length !== 2 ||
          !p.includes(me.uid) || !p.includes(person.uid)) {
        throw new Error("Chat participants do not match.");
      }
    }

    if (chatId !== thisChat) return;

    $("chatStatus").textContent = "Connected";
    $("message").disabled = false;
    $("send").disabled = false;

    // Track the recipient's last-read time.
    stopReceipt = onSnapshot(
      doc(db,"chats",thisChat,"receipts",person.uid),
      snap => {
        receiptCache[thisChat] = snap.exists()
          ? snap.data().lastReadAt?.toDate?.() || null : null;
        renderReadStatus();
      },
      error => console.warn("Read receipt:",error.code)
    );

    // Listen for typing state.
    stopTyping = onSnapshot(
      collection(db,"chats",thisChat,"typing"),
      snapshot => {
        const other = snapshot.docs.find(d => d.id === person.uid);
        const data = other?.data();
        $("typing").textContent = data?.typing === true
          ? person.name + " is typing..." : "";
      },
      error => console.warn("Typing:",error.code)
    );

    // Live message listener.
    const messagesQuery = query(
      collection(db,"chats",thisChat,"messages"),
      orderBy("createdAt","asc"),
      limit(100)
    );

    stopMessages = onSnapshot(messagesQuery,async snapshot => {
      if (chatId !== thisChat) return;

      const newIncoming = [];
      snapshot.docChanges().forEach(change => {
        if (change.type === "added" &&
            change.doc.data().senderId !== me.uid) {
          newIncoming.push(change.doc);
        }
      });

      if (!firstMessageSnapshot && newIncoming.length &&
          document.visibilityState !== "visible" &&
          "Notification" in window &&
          Notification.permission === "granted") {
        const latest = newIncoming[newIncoming.length - 1].data();
        new Notification("PAZZAN.COM — " + person.name,{
          body:latest.text || "New message"
        });
      }

      firstMessageSnapshot = false;
      lastSeenMessageIds = new Set(snapshot.docs.map(d => d.id));
      $("messages").replaceChildren();

      if (snapshot.empty) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Say hello to start chatting!";
        $("messages").append(empty);
      }

      snapshot.forEach(messageDoc => {
        const data = messageDoc.data();
        const bubble = document.createElement("div");
        bubble.className = "bubble" +
          (data.senderId === me.uid ? " mine" : "");

        const content = document.createElement("div");
        content.textContent = data.text || "";

        const meta = document.createElement("span");
        meta.className = "meta";
        const time = data.createdAt?.toDate?.();
        meta.textContent = (time ? time.toLocaleTimeString([],{
          hour:"2-digit",minute:"2-digit"
        }) : "Sending...") +
          (data.senderId === me.uid ? " ✓" : "");

        bubble.append(content,meta);
        $("messages").append(bubble);
      });

      $("messages").scrollTop = $("messages").scrollHeight;

      // Mark messages as read using a separate receipt document.
      try {
        await setDoc(doc(db,"chats",thisChat,"receipts",me.uid),{
          lastReadAt:serverTimestamp()
        });
      } catch (error) {
        console.warn("Read receipt update:",error.code);
      }

      renderReadStatus();
    },report);
  } catch (error) {
    report(error);
    $("chatStatus").textContent = "Unable to open chat.";
    $("message").disabled = true;
    $("send").disabled = true;
  }
}

function renderReadStatus() {
  const readAt = receiptCache[chatId];
  if (!readAt) return;

  // Update visible outgoing message labels.
  document.querySelectorAll(".bubble.mine .meta").forEach(meta => {
    if (meta.textContent.includes("✓")) {
      meta.textContent = meta.textContent.replace(/✓+$/, "✓✓");
      meta.style.color = "#00e5ff";
    }
  });
}

async function sendMessage(event) {
  event.preventDefault();
  const text = $("message").value.trim();

  if (!text || !me || !selected || !chatId || sending) return;

  sending = true;
  $("send").disabled = true;
  const thisChat = chatId;
  const recipient = selected;

  try {
    const [mine,theirs] = await Promise.all([
      approvedDoc(me.uid),approvedDoc(recipient.uid)
    ]);

    if (!mine.exists() || mine.data().enabled !== true ||
        !theirs.exists() || theirs.data().enabled !== true) {
      throw new Error("This chat is no longer approved.");
    }

    if (chatId !== thisChat) return;

    const inputText = text;
    $("message").value = "";

    await addDoc(collection(db,"chats",thisChat,"messages"),{
      text:inputText,
      senderId:me.uid,
      createdAt:serverTimestamp()
    });

    say("");
  } catch (error) {
    report(error);
    $("message").value = text;
  } finally {
    sending = false;
    $("send").disabled = !chatId;
    $("message").focus();
  }
}

$("composer").addEventListener("submit",sendMessage);

$("message").addEventListener("input",() => {
  if (!chatId) return;
  if (!isTyping) {
    isTyping = true;
    writeTyping(true);
  }

  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => {
    isTyping = false;
    writeTyping(false);
  },1200);
});

$("message").addEventListener("blur",() => {
  if (isTyping) {
    isTyping = false;
    writeTyping(false);
  }
});

$("notify").addEventListener("click",async () => {
  if (!("Notification" in window)) {
    say("Notifications are not supported by this browser.");
    return;
  }
  try {
    const result = await Notification.requestPermission();
    say(result === "granted"
      ? "Browser notifications enabled."
      : "Notifications were not enabled.");
  } catch (error) {
    report(error);
  }
});

$("logout").addEventListener("click",async () => {
  try {
    if (me) {
      await setDoc(doc(db,"presence",me.uid),{
        online:false,updatedAt:serverTimestamp()
      });
    }
    await signOut(auth);
    window.location.href = "login.html";
  } catch (error) {
    report(error);
  }
});

onAuthStateChanged(auth,async user => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  me = user;

  try {
    const mine = await approvedDoc(me.uid);
    if (!mine.exists() || mine.data().enabled !== true) {
      say("Your account is not enabled for private chat.");
      return;
    }

    const updatePresence = async online => {
      try {
        await setDoc(doc(db,"presence",me.uid),{
          online,updatedAt:serverTimestamp()
        });
      } catch (error) {
        console.warn("Presence update:",error.code);
      }
    };

    await updatePresence(true);
    presenceTimer = setInterval(() => {
      if (document.visibilityState === "visible") updatePresence(true);
    },25000);

    document.addEventListener("visibilitychange",() => {
      if (document.visibilityState === "visible") updatePresence(true);
    });

    window.addEventListener("pagehide",() => {
      // Best-effort offline update; browsers may stop page scripts immediately.
      updatePresence(false);
    });

    await loadFriends();
  } catch (error) {
    report(error);
  }
});
</script>
</body>
</html>
