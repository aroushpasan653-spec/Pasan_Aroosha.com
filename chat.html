
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAZZAN.COM | Private Chat</title>

  <style>
    :root {
      --bg: #05080d;
      --panel: rgba(12, 23, 34, .78);
      --green: #39ff88;
      --cyan: #00e5ff;
      --text: #f3fff9;
      --muted: #a9bac8;
      --border: rgba(57, 255, 136, .24);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: Arial, sans-serif;
      background:
        radial-gradient(ellipse at top left, #103b36 0, transparent 40%),
        radial-gradient(ellipse at bottom right, #10284a 0, transparent 40%),
        var(--bg);
    }

    button, input { font: inherit; }

    button {
      cursor: pointer;
      color: var(--text);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 16px 5%;
      background: rgba(4, 8, 14, .72);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(20px);
    }

    .logo {
      color: var(--green);
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1px;
      text-decoration: none;
      text-shadow: 0 0 12px #39ff8866;
    }

    .small-btn, .send-btn {
      border: 1px solid var(--border);
      background: rgba(57, 255, 136, .09);
      border-radius: 12px;
      padding: 10px 14px;
    }

    .small-btn:hover, .send-btn:hover {
      border-color: var(--green);
    }

    .layout {
      width: min(1100px, 94%);
      margin: 24px auto;
      display: grid;
      grid-template-columns: 290px minmax(0, 1fr);
      gap: 18px;
    }

    .glass {
      min-width: 0;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      backdrop-filter: blur(18px);
      box-shadow: 0 0 30px #00e5ff0b;
      overflow: hidden;
    }

    .panel-head {
      padding: 18px;
      border-bottom: 1px solid var(--border);
    }

    h2 {
      font-size: 18px;
      margin: 0 0 7px;
    }

    .muted, .status {
      color: var(--muted);
      font-size: 13px;
    }

    #friendList {
      padding: 10px;
      max-height: 65vh;
      overflow-y: auto;
    }

    .friend {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px;
      margin-bottom: 7px;
      text-align: left;
      border: 1px solid transparent;
      border-radius: 14px;
      background: rgba(255,255,255,.025);
    }

    .friend:hover, .friend.active {
      background: rgba(57,255,136,.08);
      border-color: var(--border);
    }

    .avatar {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--green);
      background: rgba(57,255,136,.10);
      border: 1px solid var(--border);
      font-weight: bold;
    }

    .friend-name {
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .chat-panel {
      display: flex;
      flex-direction: column;
      min-height: 560px;
    }

    .chat-head {
      padding: 18px;
      border-bottom: 1px solid var(--border);
    }

    #messages {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
      min-height: 320px;
      max-height: 56vh;
      padding: 18px;
      overflow-y: auto;
    }

    .bubble {
      max-width: 82%;
      padding: 11px 14px;
      border-radius: 15px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      line-height: 1.45;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
    }

    .bubble.mine {
      align-self: flex-end;
      background: rgba(57,255,136,.10);
      border-color: var(--border);
    }

    .bubble .time {
      display: block;
      margin-top: 6px;
      font-size: 11px;
      color: var(--muted);
    }

    .composer {
      display: flex;
      gap: 10px;
      padding: 14px;
      border-top: 1px solid var(--border);
    }

    #messageInput {
      min-width: 0;
      flex: 1;
      padding: 13px;
      color: var(--text);
      background: rgba(0,0,0,.25);
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
    }

    #messageInput:focus {
      border-color: var(--cyan);
    }

    .send-btn {
      color: var(--green);
      font-weight: bold;
    }

    .empty {
      margin: auto;
      padding: 25px;
      text-align: center;
      color: var(--muted);
      line-height: 1.6;
    }

    #notice {
      padding: 12px 18px;
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    @media (max-width: 700px) {
      .layout {
        grid-template-columns: 1fr;
        margin: 14px auto;
      }

      #friendList {
        display: flex;
        gap: 8px;
        max-height: none;
        overflow-x: auto;
      }

      .friend {
        width: 180px;
        min-width: 180px;
        margin: 0;
      }

      .chat-panel { min-height: 470px; }

      #messages {
        min-height: 270px;
        max-height: 48vh;
      }

      .topbar { padding: 14px; }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <a class="logo" href="index.html">PAZZAN.COM</a>
    <button class="small-btn" id="logoutBtn" hidden>Log out</button>
  </header>

  <main class="layout">
    <section class="glass">
      <div class="panel-head">
        <h2>My Friends</h2>
        <div class="muted">Approved accounts only</div>
      </div>
      <div id="friendList">
        <div class="empty">Loading friends...</div>
      </div>
    </section>

    <section class="glass chat-panel">
      <div class="chat-head">
        <h2 id="chatTitle">Private Chat</h2>
        <div class="status" id="chatStatus">Select a friend to start chatting.</div>
      </div>

      <div id="messages">
        <div class="empty">Choose an approved friend to open a chat.</div>
      </div>

      <div class="composer">
        <input
          id="messageInput"
          type="text"
          maxlength="2000"
          placeholder="Type a message..."
          autocomplete="off"
          disabled
        >
        <button id="sendBtn" class="send-btn" disabled>Send</button>
      </div>

      <div id="notice" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      doc,
      getDoc,
      getDocs,
      query,
      where,
      orderBy,
      limit,
      onSnapshot,
      setDoc,
      addDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB3G98XBTZH6NFiZx6NQmyEKR8g6vnSYNQ",
      authDomain: "pasan-fc8e2.firebaseapp.com",
      projectId: "pasan-fc8e2",
      storageBucket: "pasan-fc8e2.firebasestorage.app",
      messagingSenderId: "330282693990",
      appId: "1:330282693990:web:f754a4a09efaa73ab5c4a7",
      measurementId: "G-B12LL33EQ3"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const $ = (id) => document.getElementById(id);

    let currentUser = null;
    let selectedFriend = null;
    let activeChatId = null;
    let stopMessages = null;
    let friendButtons = [];
    let sending = false;

    function notice(message) {
      $("notice").textContent = message;
    }

    function showError(error) {
      console.error(error);

      if (error.code === "permission-denied") {
        notice("Permission denied: check Firestore Rules and friend document IDs.");
      } else {
        notice(error.message || "Something went wrong.");
      }
    }

    function stopCurrentChat() {
      if (stopMessages) {
        stopMessages();
        stopMessages = null;
      }

      activeChatId = null;
      selectedFriend = null;
      $("messageInput").disabled = true;
      $("sendBtn").disabled = true;
    }

    function makeChatId(uidA, uidB) {
      return [uidA, uidB].sort().join("_");
    }

    function createFriendButton(friend) {
      const button = document.createElement("button");
      button.className = "friend";
      button.type = "button";

      const avatar = document.createElement("span");
      avatar.className = "avatar";
      avatar.textContent = (friend.name || friend.email || "?")
        .trim().charAt(0).toUpperCase();

      const details = document.createElement("span");
      const name = document.createElement("div");
      name.className = "friend-name";
      name.textContent = friend.name || "Friend";

      const email = document.createElement("div");
      email.className = "muted";
      email.textContent = friend.email || "";

      details.append(name, email);
      button.append(avatar, details);

      button.addEventListener("click", () => openChat(friend, button));

      return button;
    }

    async function loadFriends() {
      $("friendList").replaceChildren();
      const loading = document.createElement("div");
      loading.className = "empty";
      loading.textContent = "Loading friends...";
      $("friendList").append(loading);

      try {
        // Rules require the query to limit results to enabled documents.
        const friendsQuery = query(
          collection(db, "friend"),
          where("enabled", "==", true)
        );

        const snapshot = await getDocs(friendsQuery);
        $("friendList").replaceChildren();
        friendButtons = [];

        snapshot.forEach((friendDoc) => {
          // Document ID must be the person's Firebase Auth UID.
          const uid = friendDoc.id;

          if (uid === currentUser.uid) return;

          const data = friendDoc.data();
          const friend = {
            uid,
            name: data.name || "Friend",
            email: data.email || ""
          };

          const button = createFriendButton(friend);
          friendButtons.push(button);
          $("friendList").append(button);
        });

        if (!friendButtons.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent =
            "No other approved friends found. Check the friend documents.";
          $("friendList").append(empty);
        }
      } catch (error) {
        showError(error);
        $("friendList").replaceChildren();

        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Could not load friends.";
        $("friendList").append(empty);
      }
    }

    async function openChat(friend, button) {
      if (!currentUser || !friend.uid) return;

      stopCurrentChat();
      friendButtons.forEach((item) => item.classList.remove("active"));
      button.classList.add("active");

      selectedFriend = friend;
      activeChatId = makeChatId(currentUser.uid, friend.uid);

      $("chatTitle").textContent = friend.name;
      $("chatStatus").textContent = "Connecting...";
      $("messages").replaceChildren();
      $("messageInput").disabled = true;
      $("sendBtn").disabled = true;
      notice("");

      try {
        // Confirm both accounts are still approved before opening the chat.
        const myFriendDoc = await getDoc(
          doc(db, "friend", currentUser.uid)
        );
        const theirFriendDoc = await getDoc(
          doc(db, "friend", friend.uid)
        );

        if (
          !myFriendDoc.exists() ||
          myFriendDoc.data().enabled !== true ||
          !theirFriendDoc.exists() ||
          theirFriendDoc.data().enabled !== true
        ) {
          throw new Error("One of these accounts is not approved for chat.");
        }

        const chatRef = doc(db, "chats", activeChatId);
        const chatSnapshot = await getDoc(chatRef);

        if (!chatSnapshot.exists()) {
          await setDoc(chatRef, {
            participants: [currentUser.uid, friend.uid].sort(),
            createdAt: serverTimestamp()
          });
        } else {
          const participants = chatSnapshot.data().participants;

          if (
            !Array.isArray(participants) ||
            participants.length !== 2 ||
            !participants.includes(currentUser.uid) ||
            !participants.includes(friend.uid)
          ) {
            throw new Error("Chat participants do not match.");
          }
        }

        // A newer selection may have happened while the requests were pending.
        const chatId = activeChatId;
        if (chatId !== makeChatId(currentUser.uid, friend.uid)) return;

        $("chatStatus").textContent = "Connected";
        $("messageInput").disabled = false;
        $("sendBtn").disabled = false;

        const messagesQuery = query(
          collection(db, "chats", chatId, "messages"),
          orderBy("createdAt", "asc"),
          limit(100)
        );

        stopMessages = onSnapshot(
          messagesQuery,
          (snapshot) => {
            if (activeChatId !== chatId) return;

            $("messages").replaceChildren();

            if (snapshot.empty) {
              const empty = document.createElement("div");
              empty.className = "empty";
              empty.textContent = "Say hello to start the conversation!";
              $("messages").append(empty);
              return;
            }

            snapshot.forEach((messageDoc) => {
              const data = messageDoc.data();

              const bubble = document.createElement("div");
              bubble.className = "bubble" +
                (data.senderId === currentUser.uid ? " mine" : "");

              const text = document.createElement("div");
              text.textContent = data.text || "";

              const time = document.createElement("span");
              time.className = "time";

              if (data.createdAt?.toDate) {
                time.textContent = data.createdAt.toDate().toLocaleString();
              } else {
                time.textContent = "Sending...";
              }

              bubble.append(text, time);
              $("messages").append(bubble);
            });

            $("messages").scrollTop = $("messages").scrollHeight;
          },
          showError
        );
      } catch (error) {
        showError(error);
        $("chatStatus").textContent = "Unable to open chat.";
        $("messageInput").disabled = true;
        $("sendBtn").disabled = true;
      }
    }

    async function sendMessage() {
      const text = $("messageInput").value.trim();

      if (
        !text ||
        !currentUser ||
        !selectedFriend ||
        !activeChatId ||
        sending
      ) return;

      sending = true;
      $("sendBtn").disabled = true;

      try {
        const chatId = activeChatId;
        const recipient = selectedFriend;

        // Recheck approval before sending.
        const [mine, theirs] = await Promise.all([
          getDoc(doc(db, "friend", currentUser.uid)),
          getDoc(doc(db, "friend", recipient.uid))
        ]);

        if (
          !mine.exists() || mine.data().enabled !== true ||
          !theirs.exists() || theirs.data().enabled !== true
        ) {
          throw new Error("This chat is no longer approved.");
        }

        if (activeChatId !== chatId) return;

        $("messageInput").value = "";

        await addDoc(
          collection(db, "chats", chatId, "messages"),
          {
            text,
            senderId: currentUser.uid,
            createdAt: serverTimestamp()
          }
        );

        notice("");
      } catch (error) {
        showError(error);
      } finally {
        sending = false;
        $("sendBtn").disabled = !activeChatId;
        $("messageInput").focus();
      }
    }

    $("sendBtn").addEventListener("click", sendMessage);

    $("messageInput").addEventListener("keydown", (event) => {
      if (event.key === "Enter") sendMessage();
    });

    $("logoutBtn").addEventListener("click", async () => {
      try {
        await signOut(auth);
        window.location.href = "login.html";
      } catch (error) {
        showError(error);
      }
    });

    onAuthStateChanged(auth, async (user) => {
      stopCurrentChat();

      if (!user) {
        window.location.href = "login.html";
        return;
      }

      currentUser = user;
      $("logoutBtn").hidden = false;
      $("chatTitle").textContent = "Private Chat";
      $("chatStatus").textContent = "Select a friend to start chatting.";

      await loadFriends();
    });
  </script>
</body>
</html>
