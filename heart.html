<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#03040b">
<title>This is for You | PAZZAN</title>
<style>
:root{--neon:#00e5ff;--neon2:#ff2bd6;--bg:#03040b;--text:#d9faff}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{min-height:100vh;background:radial-gradient(ellipse at 50% 43%,#10132a 0%,#050610 45%,#020308 78%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden;text-align:center}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.24;background-image:radial-gradient(#35425c 1px,transparent 1px);background-size:19px 19px;mask-image:linear-gradient(to bottom,black,transparent 80%)}
main{position:relative;width:min(100%,850px);min-height:100vh;margin:auto;padding:27px 18px 30px;display:flex;flex-direction:column;align-items:center}
.brand{display:flex;align-items:center;gap:15px;width:100%;justify-content:center;color:var(--neon);font-size:clamp(15px,4vw,24px);font-weight:800;letter-spacing:.19em;text-shadow:0 0 12px var(--neon);margin:8px 0 22px}
.brand:before,.brand:after{content:"";height:2px;width:22%;max-width:150px;background:linear-gradient(90deg,transparent,var(--neon2),var(--neon));box-shadow:0 0 9px var(--neon)}
.kicker{font-size:clamp(10px,2.7vw,14px);letter-spacing:.25em;color:#9ebdce;margin-bottom:8px;text-transform:uppercase}
h1{font-family:"Segoe Script","Brush Script MT",cursive;font-size:clamp(48px,12vw,92px);font-weight:600;line-height:1.13;letter-spacing:-.045em;margin:0 0 18px;background:linear-gradient(100deg,#00f0ff 12%,#7d62ff 50%,#ff43d4 87%);color:transparent;background-clip:text;-webkit-background-clip:text;filter:drop-shadow(0 0 12px #00d9ff55)}
.subtitle{font-size:clamp(11px,3.1vw,16px);letter-spacing:.19em;line-height:1.8;text-transform:uppercase;color:#8defff;margin:0 0 5px}
.ornament{color:var(--neon2);font-size:25px;text-shadow:0 0 12px var(--neon2);margin:0 0 -3px}
#heartCanvas{display:block;width:100%;height:clamp(310px,95vw,570px);max-height:570px;margin:0 auto 0;filter:drop-shadow(0 0 14px #00e5ff25)}
.controls{width:100%;display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:-2px}
button,.website{font:700 clamp(15px,4vw,21px)/1.2 system-ui,sans-serif;letter-spacing:-.02em;color:var(--neon);background:rgba(3,13,30,.8);border:2px solid var(--neon);border-radius:999px;padding:17px 25px;min-height:60px;box-shadow:0 0 12px color-mix(in srgb,var(--neon) 45%,transparent),inset 0 0 15px #0a5b8030;text-decoration:none;display:inline-flex;justify-content:center;align-items:center;gap:10px;cursor:pointer;transition:transform .2s,box-shadow .2s,color .2s; -webkit-tap-highlight-color:transparent}
button:active,.website:active{transform:scale(.97)}button:hover,.website:hover{box-shadow:0 0 24px color-mix(in srgb,var(--neon) 70%,transparent);transform:translateY(-2px)}
#replay{width:min(100%,430px)}
.bottom-controls{display:flex;justify-content:center;align-items:stretch;gap:14px;width:100%;flex-wrap:wrap}
#changeColor{color:var(--neon2);border-color:var(--neon2);box-shadow:0 0 14px #ff2bd644,inset 0 0 15px #ff2bd61a;flex:1;max-width:420px}
.website{color:var(--neon);border-color:var(--neon);flex:0 1 230px}
.footer{display:flex;align-items:center;justify-content:center;gap:18px;margin:35px 0 0;color:#c95bff;font-size:12px;letter-spacing:.28em}
.footer:before,.footer:after{content:"";height:2px;width:65px;background:linear-gradient(90deg,transparent,var(--neon2),var(--neon));box-shadow:0 0 7px var(--neon2)}
.small-note{font-size:11px;color:#647b98;margin-top:14px;letter-spacing:.08em}
@media(max-width:420px){main{padding:24px 14px 24px}.brand{gap:9px;letter-spacing:.12em;margin-bottom:22px}.brand:before,.brand:after{width:13%}h1{font-size:clamp(46px,13vw,62px)}#heartCanvas{height:clamp(310px,93vw,400px)}button,.website{min-height:56px;padding:15px 16px}.bottom-controls{gap:10px}#changeColor{flex-basis:100%;max-width:none}.website{flex:1 1 100%}.footer{margin-top:28px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="brand">PAZZAN.COM</div>
  <p class="kicker">A little glow, just for you</p>
  <h1>This is for You</h1>
  <p class="subtitle">Some things are just<br>meant to brighten your day</p>
  <div class="ornament">♡</div>
  <canvas id="heartCanvas" aria-label="Animated heart made from glowing neon particles"></canvas>
  <div class="controls">
    <button id="replay" type="button">↻ &nbsp; Replay Animation</button>
    <div class="bottom-controls">
      <button id="changeColor" type="button">✦ &nbsp; Change Neon Color</button>
      <a class="website" href="./index.html">← &nbsp; Website</a>
    </div>
  </div>
  <div class="footer"><span>♡</span><span>SPREAD MORE LOVE</span></div>
  <p class="small-note">MADE WITH LIGHT · POWERED BY PAZZAN</p>
</main>
<script>
(() => {
  const canvas = document.getElementById('heartCanvas');
  const ctx = canvas.getContext('2d');
  const replayBtn = document.getElementById('replay');
  const colorBtn = document.getElementById('changeColor');

  let w = 0, h = 0, dpr = 1, particles = [], stars = [];
  let raf = 0, startTime = 0, paletteIndex = 0;
  const palette = [185, 315, 45, 115, 265, 15];
  const rand = (a, b) => a + Math.random() * (b - a);

  function heartPoint(t, scale) {
    return {
      x: 16 * Math.pow(Math.sin(t), 3) * scale,
      y: -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * scale
    };
  }

  function resize() {
    const rect = canvas.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = rect.width; h = rect.height;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    createParticles();
  }

  function createParticles() {
    particles = [];
    stars = [];
    const scale = Math.min(w / 38, h / 34) * 0.91;
    const count = Math.max(380, Math.min(900, Math.round(w * 1.25)));
    for (let i = 0; i < count; i++) {
      const t = Math.random() * Math.PI * 2;
      const edge = heartPoint(t, scale);
      const inside = Math.random() < 0.67;
      let tx, ty;
      if (inside) {
        const k = Math.sqrt(Math.random());
        tx = edge.x * k;
        ty = edge.y * k;
      } else {
        tx = edge.x * rand(0.96, 1.12);
        ty = edge.y * rand(0.96, 1.12);
      }
      const angle = rand(0, Math.PI * 2);
      const distance = rand(Math.max(w, h) * 0.35, Math.max(w, h) * 0.85);
      particles.push({
        tx, ty,
        sx: Math.cos(angle) * distance,
        sy: Math.sin(angle) * distance,
        size: rand(0.7, 2.5),
        hueOffset: rand(-55, 55),
        phase: rand(0, Math.PI * 2),
        speed: rand(0.7, 1.6),
        sparkle: Math.random() < 0.17,
        delay: rand(0, 0.9)
      });
    }
    for (let i = 0; i < 70; i++) {
      stars.push({ x: rand(0, w), y: rand(0, h), size: rand(0.5, 1.7), phase: rand(0, 7) });
    }
  }

  function draw(now) {
    raf = requestAnimationFrame(draw);
    if (!startTime) startTime = now;
    const time = (now - startTime) / 1000;
    const hue = palette[paletteIndex];
    const scale = Math.min(w / 38, h / 34) * 0.91;
    const cx = w / 2, cy = h * 0.48;

    ctx.clearRect(0, 0, w, h);

    // Soft coloured glow behind the heart.
    const glow = ctx.createRadialGradient(cx, cy, 2, cx, cy, Math.min(w, h) * 0.49);
    glow.addColorStop(0, `hsla(${hue},100%,55%,0.13)`);
    glow.addColorStop(0.55, `hsla(${(hue + 80) % 360},100%,45%,0.045)`);
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, w, h);

    // Twinkling background stars.
    for (const s of stars) {
      const alpha = 0.12 + 0.38 * (0.5 + 0.5 * Math.sin(time * 1.6 + s.phase));
      ctx.globalAlpha = alpha;
      ctx.fillStyle = `hsl(${(hue + s.phase * 30) % 360},100%,75%)`;
      ctx.fillRect(s.x, s.y, s.size, s.size);
    }
    ctx.globalAlpha = 1;

    // A travelling light traces the heart outline.
    ctx.save();
    ctx.translate(cx, cy);
    ctx.beginPath();
    for (let i = 0; i <= 260; i++) {
      const p = heartPoint(i / 260 * Math.PI * 2, scale);
      if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
    }
    ctx.closePath();
    ctx.strokeStyle = `hsla(${hue},100%,65%,0.22)`;
    ctx.lineWidth = 1.4;
    ctx.shadowBlur = 16;
    ctx.shadowColor = `hsl(${hue},100%,60%)`;
    ctx.stroke();

    const traceT = (time * 0.23) % 1;
    const trace = heartPoint(traceT * Math.PI * 2, scale);
    ctx.beginPath();
    ctx.arc(trace.x, trace.y, 4 + 2 * Math.sin(time * 5), 0, Math.PI * 2);
    ctx.fillStyle = `hsl(${(hue + 55) % 360},100%,80%)`;
    ctx.shadowBlur = 26;
    ctx.shadowColor = ctx.fillStyle;
    ctx.fill();
    ctx.restore();

    // Heartbeat pulse + particles flying in to form the heart.
    const beat = 1 + 0.055 * Math.pow(Math.max(0, Math.sin(time * 3.2)), 10)
                   + 0.025 * Math.sin(time * 2.1);
    const reveal = Math.min(1, time / 2.1);
    for (const p of particles) {
      const local = Math.max(0, Math.min(1, (time - p.delay) / 1.55));
      const eased = 1 - Math.pow(1 - local, 3);
      const drift = Math.sin(time * p.speed + p.phase) * 2.7;
      const x = cx + p.sx * (1 - eased) + p.tx * eased * beat + drift;
      const y = cy + p.sy * (1 - eased) + p.ty * eased * beat
                  + Math.cos(time * 1.1 + p.phase) * 2.3;
      const pulse = 0.58 + 0.42 * Math.sin(time * p.speed * 2.5 + p.phase);
      const ph = (hue + p.hueOffset + 360) % 360;
      const color = `hsl(${ph},100%,${62 + pulse * 28}%)`;
      const radius = p.size * (0.65 + pulse * 0.75) * (0.6 + 0.4 * reveal);

      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.globalAlpha = 0.25 + 0.75 * eased;
      ctx.fillStyle = color;
      ctx.shadowBlur = p.sparkle ? 19 : 9;
      ctx.shadowColor = color;
      ctx.fill();

      if (p.sparkle && pulse > 0.76 && eased > 0.25) {
        ctx.globalAlpha = 0.75;
        ctx.strokeStyle = color;
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(x - 4, y); ctx.lineTo(x + 4, y);
        ctx.moveTo(x, y - 4); ctx.lineTo(x, y + 4);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;

    // Tiny orbiting comets circling the heart.
    for (let i = 0; i < 5; i++) {
      const a = time * (0.55 + i * 0.07) + i * Math.PI * 0.4;
      const rx = Math.min(w * 0.43, scale * 19);
      const ry = Math.min(h * 0.36, scale * 17);
      const x = cx + Math.cos(a) * rx;
      const y = cy + Math.sin(a) * ry;
      const comet = ctx.createRadialGradient(x, y, 0, x, y, 13);
      comet.addColorStop(0, `hsla(${(hue + i * 67) % 360},100%,90%,0.95)`);
      comet.addColorStop(1, `hsla(${(hue + i * 67) % 360},100%,55%,0)`);
      ctx.fillStyle = comet;
      ctx.beginPath(); ctx.arc(x, y, 13, 0, Math.PI * 2); ctx.fill();
    }

    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }

  function replay() {
    cancelAnimationFrame(raf);
    startTime = 0;
    createParticles();
    raf = requestAnimationFrame(draw);
  }

  colorBtn.addEventListener('click', () => {
    paletteIndex = (paletteIndex + 1) % palette.length;
    const hue = palette[paletteIndex];
    document.documentElement.style.setProperty('--neon', `hsl(${hue},100%,58%)`);
    document.documentElement.style.setProperty('--neon2', `hsl(${(hue + 105) % 360},100%,62%)`);
    replay();
  });

  replayBtn.addEventListener('click', replay);
  window.addEventListener('resize', resize);
  resize();
  raf = requestAnimationFrame(draw);
})();
</script>
</body>
</html>
