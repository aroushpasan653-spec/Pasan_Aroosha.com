
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Particle Heart | PAZZAN.COM</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  overflow:hidden;
  background:#03050b;
  color:white;
  font-family:Arial,sans-serif;
}
canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}
.ui{
  position:relative;
  z-index:2;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  text-align:center;
  padding:35px 18px 25px;
  pointer-events:none;
}
h1{
  margin:0;
  font-size:clamp(25px,6vw,42px);
  letter-spacing:2px;
  color:#39ff88;
  text-shadow:0 0 12px #39ff88,0 0 30px #00e5ff;
}
p{
  color:#9dd9ed;
  letter-spacing:2px;
  font-size:12px;
}
.controls{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  pointer-events:auto;
}
button,a{
  padding:12px 18px;
  border-radius:30px;
  border:1px solid #00e5ff;
  background:#071322;
  color:#00e5ff;
  text-decoration:none;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 0 12px #00e5ff30;
}
button:hover,a:hover{
  background:#103047;
  box-shadow:0 0 22px #00e5ff80;
}
#colorBtn{border-color:#ff2bd6;color:#ff70e8}
footer{color:#648ba0;font-size:12px;letter-spacing:2px}
</style>
</head>

<body>
<canvas id="heartCanvas"></canvas>

<div class="ui">
  <div>
    <h1>NEON PARTICLE HEART</h1>
    <p>MADE WITH LIGHT • POWERED BY PAZZAN</p>
  </div>

  <div class="controls">
    <button id="replayBtn">↻ Replay Animation</button>
    <button id="colorBtn">✦ Change Neon Color</button>
    <a href="index.html">← Website</a>
  </div>

  <footer>© 2026 PAZZAN.COM</footer>
</div>

<script>
const canvas = document.getElementById("heartCanvas");
const ctx = canvas.getContext("2d");

let w, h, particles = [], animationId;
let hue = 155;
let startTime = 0;

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  w = window.innerWidth;
  h = window.innerHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}

function heartPoint(t, scale){
  return {
    x: 16 * Math.pow(Math.sin(t),3) * scale,
    y: -(13*Math.cos(t)-5*Math.cos(2*t)
      -2*Math.cos(3*t)-Math.cos(4*t))*scale
  };
}

function createParticles(){
  particles = [];
  const scale = Math.min(w/38,h/36,12);
  const total = Math.min(1600,Math.floor(w*h/450));

  for(let i=0;i<total;i++){
    const t = Math.random()*Math.PI*2;
    const edge = heartPoint(t,scale);
    const fill = Math.sqrt(Math.random());

    particles.push({
      x:(Math.random()-.5)*w,
      y:(Math.random()-.5)*h,
      tx:w/2+edge.x*fill,
      ty:h/2+edge.y*fill,
      size:Math.random()*1.8+.5,
      delay:Math.random()*1.8,
      phase:Math.random()*Math.PI*2,
      speed:.7+Math.random()*1.5
    });
  }
}

function draw(time){
  animationId = requestAnimationFrame(draw);
  const elapsed = (time-startTime)/1000;

  ctx.fillStyle="rgba(3,5,11,0.22)";
  ctx.fillRect(0,0,w,h);

  const scalePulse = 1 + Math.sin(time*.0015)*.025;

  for(const p of particles){
    const progress = Math.max(0,Math.min(1,
      (elapsed-p.delay)/1.5));

    const ease = 1-Math.pow(1-progress,3);
    const x = p.x+(p.tx-p.x)*ease;
    const y = p.y+(p.ty-p.y)*ease;

    const px = w/2+(x-w/2)*scalePulse;
    const py = h/2+(y-h/2)*scalePulse;

    const flicker = .55+.45*Math.sin(time*.003*p.speed+p.phase);
    const color = (hue + p.phase*30 + time*.015)%360;

    ctx.beginPath();
    ctx.fillStyle=`hsla(${color},100%,65%,${flicker})`;
    ctx.shadowBlur=progress>0.95?12:5;
    ctx.shadowColor=`hsl(${color},100%,60%)`;
    ctx.arc(px,py,p.size,0,Math.PI*2);
    ctx.fill();
  }

  ctx.shadowBlur=0;
}

function startAnimation(){
  cancelAnimationFrame(animationId);
  resize();
  createParticles();
  ctx.clearRect(0,0,w,h);
  startTime=performance.now();
  animationId=requestAnimationFrame(draw);
}

document.getElementById("replayBtn").addEventListener("click",startAnimation);

document.getElementById("colorBtn").addEventListener("click",()=>{
  hue=(hue+65)%360;
});

window.addEventListener("resize",startAnimation);

startAnimation();
</script>
</body>
</html>
