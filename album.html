<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Album | Pasan Aroosha</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0f19;
      color: white;
      min-height: 100vh;
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 9999;
      background: transparent;
      border: none;
    }

    .nav-container {
      max-width: 1200px;
      min-height: 76px;
      margin: auto;
      padding: 0 25px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      color: white;
      text-decoration: none;
      font-size: 24px;
      font-weight: bold;
    }

    .logo span {
      color: #a78bfa;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      transition: 0.3s;
    }

    .nav-links a:hover {
      color: #a78bfa;
    }

    .login-btn {
      background: #8b5cf6;
      padding: 10px 18px;
      border-radius: 8px;
    }

    #userEmail {
      display: none;
      color: #c4b5fd;
      font-size: 14px;
    }

    #logoutBtn {
      display: none;
      background: #ef4444;
      color: white;
      border: none;
      padding: 10px 17px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .menu-toggle {
      display: none;
      font-size: 28px;
      cursor: pointer;
    }

    /* HEADER */

    .album-header {
      max-width: 1100px;
      margin: auto;
      padding: 65px 25px 35px;
      text-align: center;
    }

    .back-btn {
      display: inline-block;
      margin-bottom: 30px;

      color: #c4b5fd;
      text-decoration: none;

      border: 1px solid rgba(167,139,250,0.35);
      padding: 10px 18px;
      border-radius: 8px;

      transition: 0.3s;
    }

    .back-btn:hover {
      background: #8b5cf6;
      color: white;
    }

    .album-header h1 {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .album-header h1 span {
      color: #a78bfa;
    }

    .album-header p {
      color: #a1a1aa;
      font-size: 16px;
    }

    /* PHOTO GRID */

    .photo-grid {
      max-width: 1200px;
      margin: auto;
      padding: 20px 25px 90px;

      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .photo {
      height: 280px;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;

      background: #111827;

      border: 1px solid rgba(167,139,250,0.15);

      transition: 0.35s;
    }

    .photo:hover {
      transform: translateY(-5px);
      border-color: rgba(167,139,250,0.6);
      box-shadow: 0 15px 35px rgba(0,0,0,0.35);
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: 0.4s;
    }

    .photo:hover img {
      transform: scale(1.05);
    }

    /* EMPTY */

    .empty {
      display: none;
      text-align: center;
      padding: 30px 20px 100px;
      color: #a1a1aa;
    }

    .empty h2 {
      color: white;
      margin-bottom: 10px;
    }

    /* LIGHTBOX */

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 99999;

      display: none;
      align-items: center;
      justify-content: center;

      background: rgba(0,0,0,0.94);
      padding: 25px;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 95%;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 10px;
    }

    .close-lightbox {
      position: absolute;
      top: 15px;
      right: 25px;

      font-size: 40px;
      color: white;
      cursor: pointer;
    }

    footer {
      text-align: center;
      padding: 30px 20px;

      color: #71717a;

      border-top: 1px solid rgba(255,255,255,0.08);
    }

    /* MOBILE */

    @media (max-width: 850px) {

      .menu-toggle {
        display: block;
      }

      .nav-links {
        position: absolute;
        top: 76px;
        left: 0;

        width: 100%;

        display: none;

        flex-direction: column;
        align-items: center;

        gap: 20px;
        padding: 25px;

        background: rgba(11,15,25,0.97);
      }

      .nav-links.active {
        display: flex;
      }

      .photo-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .album-header h1 {
        font-size: 40px;
      }
    }

    @media (max-width: 550px) {

      .nav-container {
        padding: 0 18px;
      }

      .logo {
        font-size: 21px;
      }

      .photo-grid {
        grid-template-columns: 1fr;
        padding: 20px 18px 70px;
      }

      .photo {
        height: 300px;
      }

      .album-header {
        padding: 50px 18px 30px;
      }

      .album-header h1 {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->

  <nav>
    <div class="nav-container">

      <a href="index.html" class="logo">
        Pasan<span>Aroosha</span>
      </a>

      <div class="menu-toggle" id="menuToggle">
        ☰
      </div>

      <div class="nav-links" id="navLinks">

        <a href="index.html">Home</a>

        <a href="index.html#about">About</a>

        <a href="index.html#blog">Blog</a>

        <a href="gallery.html">Gallery</a>

        <a href="index.html#contact">Contact</a>

        <a
          href="login.html"
          id="loginLink"
          class="login-btn"
        >
          Login
        </a>

        <span id="userEmail"></span>

        <button id="logoutBtn">
          Logout
        </button>

      </div>
    </div>
  </nav>


  <!-- ALBUM HEADER -->

  <section class="album-header">

    <a href="gallery.html" class="back-btn">
      ← Back to Gallery
    </a>

    <h1 id="albumTitle">
      <span>Album</span>
    </h1>

    <p id="albumDescription">
      My photos
    </p>

  </section>


  <!-- PHOTO GRID -->

  <section
    class="photo-grid"
    id="photoGrid"
  ></section>


  <div
    class="empty"
    id="emptyMessage"
  >
    <h2>No Photos Yet</h2>

    <p>
      Add photos to this album.
    </p>
  </div>


  <!-- LIGHTBOX -->

  <div
    class="lightbox"
    id="lightbox"
  >

    <div
      class="close-lightbox"
      id="closeLightbox"
    >
      ×
    </div>

    <img
      id="lightboxImage"
      src=""
      alt="Photo"
    >

  </div>


  <footer>
    © 2026 Pasan Aroosha. All rights reserved.
  </footer>


  <!-- FIREBASE -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";


    const firebaseConfig = {

      apiKey:
        "AIzaSyB3G98XBTZH6NFiZx6NQmyEKR8g6vnSYNQ",

      authDomain:
        "pasan-fc8e2.firebaseapp.com",

      projectId:
        "pasan-fc8e2",

      storageBucket:
        "pasan-fc8e2.firebasestorage.app",

      messagingSenderId:
        "330282693990",

      appId:
        "1:330282693990:web:f754a4a09efaa73ab5c4a7",

      measurementId:
        "G-B12LL33EQ3"

    };


    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);


    const loginLink =
      document.getElementById("loginLink");

    const userEmail =
      document.getElementById("userEmail");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const albumTitle =
      document.getElementById("albumTitle");

    const albumDescription =
      document.getElementById("albumDescription");

    const photoGrid =
      document.getElementById("photoGrid");

    const emptyMessage =
      document.getElementById("emptyMessage");


    /* =========================
       ALBUM NAMES
       ========================= */

    const albums = {

      album1: {
        title: "My Photos",
        description: "My favorite personal photos"
      },

      album2: {
        title: "Travel",
        description: "Places and adventures"
      },

      album3: {
        title: "Memories",
        description: "Beautiful moments to remember"
      },

      dream: {
        title: "Dream",
        description: "Dreams and inspiration"
      },

      album5: {
        title: "Nature",
        description: "Nature and peaceful moments"
      },

      album6: {
        title: "Special Moments",
        description: "Moments that are special to me"
      }

    };


    /* =========================
       GET ALBUM FROM URL
       ========================= */

    const params =
      new URLSearchParams(
        window.location.search
      );

    const albumName =
      params.get("album");


    /* ==================================================
       PHOTO NAMES
       ==================================================

       මෙතන තමයි photo names දාන්න ඕන.

       Example:

       "gallery/album1/photo1.jpg"

       කියන්නේ:

       gallery folder
       → album1 folder
       → photo1.jpg

       ඔයාගේ GitHub filename එකට EXACT
       match වෙන්න ඕන.
    */


    const photos = {

      /* ALBUM 1 */

      album1: [

        "gallery/album1/9948fbad9e7bc6537270024509580806.jpg",
        "gallery/album1/4420a3fce2b79d545d6044efed79b529.jpg",
        "gallery/album1/68b4ce680bbae7b429561f584713908a.jpg",
        "gallery/album1/80837af2d4bd629f6084be842256645b.jpg",
        "gallery/album1/90d97a60787dc29d4c133e4310644d7b.jpg",
        "gallery/album1/03a42dda4b6a508c2060a1ab70d89fe3.jpg",
        "gallery/album1/04a2d930c3582666ee9f7073cbef5687.jpg",
        "gallery/album1/04a2d930c3582666ee9f7073cbef568.jpg",
        "gallery/album1/3641ac1a18cdd68fecab36335c91a8e9.jpg",
        "gallery/album1/2ebebe85be9c28f9e3d6f21bf5688262 (1).jpg"

      ],


      /* ALBUM 2 */

      album2: [

        "gallery/album2/photo1.jpg",
        "gallery/album2/photo2.jpg",
        "gallery/album2/photo3.jpg",
        "gallery/album2/photo4.jpg",
        "gallery/album2/photo5.jpg",
        "gallery/album2/photo6.jpg",
        "gallery/album2/photo7.jpg",
        "gallery/album2/photo8.jpg",
        "gallery/album2/photo9.jpg",
        "gallery/album2/photo10.jpg"

      ],


      /* ALBUM 3 */

      album3: [

        "gallery/album3/photo1.jpg",
        "gallery/album3/photo2.jpg",
        "gallery/album3/photo3.jpg",
        "gallery/album3/photo4.jpg",
        "gallery/album3/photo5.jpg",
        "gallery/album3/photo6.jpg",
        "gallery/album3/photo7.jpg",
        "gallery/album3/photo8.jpg",
        "gallery/album3/photo9.jpg",
        "gallery/album3/photo10.jpg"

      ],


      /* ALBUM 4 - DREAM */

      dream: [

        "gallery/dream/photo1.jpg",
        "gallery/dream/photo2.jpg",
        "gallery/dream/photo3.jpg",
        "gallery/dream/photo4.jpg",
        "gallery/dream/photo5.jpg",
        "gallery/dream/photo6.jpg",
        "gallery/dream/photo7.jpg",
        "gallery/dream/photo8.jpg",
        "gallery/dream/photo9.jpg",
        "gallery/dream/photo10.jpg"

      ],


      /* ALBUM 5 */

      album5: [

        "gallery/album5/photo1.jpg",
        "gallery/album5/photo2.jpg",
        "gallery/album5/photo3.jpg",
        "gallery/album5/photo4.jpg",
        "gallery/album5/photo5.jpg",
        "gallery/album5/photo6.jpg",
        "gallery/album5/photo7.jpg",
        "gallery/album5/photo8.jpg",
        "gallery/album5/photo9.jpg",
        "gallery/album5/photo10.jpg"

      ],


      /* ALBUM 6 */

      album6: [

        "gallery/album6/photo1.jpg",
        "gallery/album6/photo2.jpg",
        "gallery/album6/photo3.jpg",
        "gallery/album6/photo4.jpg",
        "gallery/album6/photo5.jpg",
        "gallery/album6/photo6.jpg",
        "gallery/album6/photo7.jpg",
        "gallery/album6/photo8.jpg",
        "gallery/album6/photo9.jpg",
        "gallery/album6/photo10.jpg"

      ]

    };


    /* =========================
       LOGIN CHECK
       ========================= */

    onAuthStateChanged(
      auth,
      (user) => {

        if (!user) {

          const redirect =
            "gallery.html?album="
            + encodeURIComponent(
                albumName || ""
              );

          window.location.href =
            "login.html?redirect="
            + encodeURIComponent(
                redirect
              );

          return;
        }


        loginLink.style.display =
          "none";

        userEmail.style.display =
          "inline";

        logoutBtn.style.display =
          "inline-block";

        userEmail.textContent =
          user.email;


        loadAlbum();

      }
    );


    /* =========================
       LOAD ALBUM
       ========================= */

    function loadAlbum() {

      const album =
        albums[albumName];


      if (!album) {

        albumTitle.innerHTML =
          "<span>Album Not Found</span>";

        albumDescription.textContent =
          "This album does not exist.";

        emptyMessage.style.display =
          "block";

        return;
      }


      albumTitle.innerHTML =
        "<span>"
        + album.title
        + "</span>";


      albumDescription.textContent =
        album.description;


      const albumPhotos =
        photos[albumName] || [];


      if (
        albumPhotos.length === 0
      ) {

        emptyMessage.style.display =
          "block";

        return;
      }


      emptyMessage.style.display =
        "none";


      albumPhotos.forEach(
        (photoSrc) => {

          const photo =
            document.createElement(
              "div"
            );

          photo.className =
            "photo";


          const image =
            document.createElement(
              "img"
            );

          image.src =
            photoSrc;

          image.alt =
            album.title;


          photo.appendChild(
            image
          );

          photoGrid.appendChild(
            photo
          );


          photo.addEventListener(
            "click",
            () => {

              lightboxImage.src =
                photoSrc;

              lightbox.classList.add(
                "active"
              );

            }
          );

        }
      );

    }


    /* =========================
       LIGHTBOX
       ========================= */

    const lightbox =
      document.getElementById(
        "lightbox"
      );

    const lightboxImage =
      document.getElementById(
        "lightboxImage"
      );

    const closeLightbox =
      document.getElementById(
        "closeLightbox"
      );


    closeLightbox.addEventListener(
      "click",
      () => {

        lightbox.classList.remove(
          "active"
        );

        lightboxImage.src = "";

      }
    );


    lightbox.addEventListener(
      "click",
      (event) => {

        if (
          event.target === lightbox
        ) {

          lightbox.classList.remove(
            "active"
          );

          lightboxImage.src = "";

        }

      }
    );


    /* =========================
       LOGOUT
       ========================= */

    logoutBtn.addEventListener(
      "click",
      async () => {

        try {

          await signOut(auth);

          window.location.href =
            "gallery.html";

        } catch (error) {

          console.error(error);

          alert(
            "Logout failed: "
            + error.message
          );

        }

      }
    );


    /* =========================
       MOBILE MENU
       ========================= */

    const menuToggle =
      document.getElementById(
        "menuToggle"
      );

    const navLinks =
      document.getElementById(
        "navLinks"
      );


    menuToggle.addEventListener(
      "click",
      () => {

        navLinks.classList.toggle(
          "active"
        );

      }
    );

  </script>

</body>
  </html>
