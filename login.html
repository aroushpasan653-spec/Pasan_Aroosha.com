<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | PAZZAN.COM</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;display:grid;place-items:center;
      padding:20px;font-family:Arial,sans-serif;color:#f4fff9;
      background:radial-gradient(ellipse at top right,#073b2a,transparent 50%),#05080d
    }
    .box{
      width:100%;max-width:400px;padding:30px;border:1px solid #39ff88;
      border-radius:20px;background:rgba(9,19,29,.94);
      box-shadow:0 0 30px #39ff8820
    }
    h1{text-align:center;color:#39ff88}
    p{text-align:center;color:#b4bfd0}
    input,button{
      width:100%;padding:14px;margin-top:13px;border-radius:10px;
      font-size:16px
    }
    input{background:#080e15;color:white;border:1px solid #385248}
    button{cursor:pointer;border:0;font-weight:bold;background:#39ff88;color:#06130b}
    button.secondary{background:transparent;color:#39ff88;border:1px solid #39ff88}
    #message{overflow-wrap:anywhere;font-size:14px;line-height:1.5}
    a{color:#39ff88}
  </style>
</head>
<body>
  <main class="box">
    <h1>PAZZAN.COM</h1>
    <p id="heading">Login to your account</p>

    <form id="authForm">
      <input id="email" type="email" placeholder="Email address" required autocomplete="email">
      <input id="password" type="password" placeholder="Password" required minlength="6" autocomplete="current-password">
      <button id="submitBtn" type="submit">Login</button>
    </form>

    <button id="toggleBtn" class="secondary" type="button">Create New Account</button>
    <p id="message" role="status"></p>
    <p><a href="index.html">Back to Website</a></p>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

    import {
      getAuth,
      setPersistence,
      browserLocalPersistence,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB3G98XBTZH6NFiZx6NQmyEKR8g6vnSYNQ",
      authDomain: "pasan-fc8e2.firebaseapp.com",
      projectId: "pasan-fc8e2",
      storageBucket: "pasan-fc8e2.firebasestorage.app",
      messagingSenderId: "330282693990",
      appId: "1:330282693990:web:f754a4a09efaa73ab5c4a7",
      measurementId: "G-B12LL33EQ3"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const form = document.getElementById("authForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const submitBtn = document.getElementById("submitBtn");
    const toggleBtn = document.getElementById("toggleBtn");
    const heading = document.getElementById("heading");
    const message = document.getElementById("message");

    let createMode = false;
    let submitting = false;

    function showMessage(text) {
      message.textContent = text;
    }

    function getRedirectTarget() {
      const params = new URLSearchParams(location.search);
      const target = params.get("redirect");

      // Only permit known pages on this same website.
      if (target === "dashboard.html") return "dashboard.html";
      if (target === "index.html") return "index.html";
      return "index.html";
    }

    async function start() {
      await setPersistence(auth, browserLocalPersistence);

      onAuthStateChanged(auth, user => {
        if (user && !submitting) {
          showMessage("Already logged in. Opening website...");
          location.replace(getRedirectTarget());
        }
      });
    }

    toggleBtn.addEventListener("click", () => {
      createMode = !createMode;
      heading.textContent = createMode
        ? "Create a new account"
        : "Login to your account";
      submitBtn.textContent = createMode ? "Create Account" : "Login";
      toggleBtn.textContent = createMode
        ? "I Already Have an Account"
        : "Create New Account";
      passwordInput.autocomplete = createMode ? "new-password" : "current-password";
      showMessage("");
    });

    form.addEventListener("submit", async event => {
      event.preventDefault();
      if (submitting) return;

      submitting = true;
      submitBtn.disabled = true;
      showMessage("Please wait...");

      try {
        await setPersistence(auth, browserLocalPersistence);

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (createMode) {
          await createUserWithEmailAndPassword(auth, email, password);
          showMessage("Account created successfully. Opening website...");
        } else {
          await signInWithEmailAndPassword(auth, email, password);
          showMessage("Login successful. Opening website...");
        }

        location.replace(getRedirectTarget());
      } catch (error) {
        const messages = {
          "auth/email-already-in-use": "This email already has an account. Please login.",
          "auth/invalid-email": "Please enter a valid email address.",
          "auth/weak-password": "Use a password with at least 6 characters.",
          "auth/invalid-credential": "Incorrect email or password.",
          "auth/network-request-failed": "Network error. Check your internet connection.",
          "auth/operation-not-allowed": "Enable Email/Password sign-in in Firebase Console."
        };

        showMessage(messages[error.code] || "Error: " + error.message);
      } finally {
        submitting = false;
        submitBtn.disabled = false;
      }
    });

    start().catch(error => {
      showMessage("Firebase setup error: " + error.message);
    });
  </script>
</body>
</html>
