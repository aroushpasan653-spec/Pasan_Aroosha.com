
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#05080d">
  <title>Login | PAZZAN.COM</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #f3fff9;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(ellipse at top left, #103b2b, transparent 45%),
        radial-gradient(ellipse at bottom right, #102b3b, transparent 40%),
        #05080d;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 30px 25px;
      background: rgba(10, 20, 28, .94);
      border: 1px solid #36f5a0;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(54, 245, 160, .12);
    }

    .logo {
      text-align: center;
      font-size: 27px;
      font-weight: 900;
      color: #36f5a0;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    h1 {
      text-align: center;
      font-size: 25px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #a6b8b0;
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 16px 0 8px;
      font-size: 14px;
      color: #dcece4;
    }

    input {
      display: block;
      width: 100%;
      padding: 14px;
      color: white;
      background: #07100d;
      border: 1px solid #254b3c;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #36f5a0;
      box-shadow: 0 0 10px rgba(54, 245, 160, .12);
    }

    .main-button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 10px;
      background: #36f5a0;
      color: #03120a;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .main-button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .switch-text {
      text-align: center;
      margin-top: 20px;
      color: #a6b8b0;
      font-size: 14px;
    }

    .switch-button {
      border: none;
      background: none;
      color: #36f5a0;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      padding: 5px;
    }

    .message {
      display: none;
      margin-top: 17px;
      padding: 12px;
      border-radius: 9px;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .message.error {
      display: block;
      background: #321818;
      border: 1px solid #a94747;
      color: #ffc4c4;
    }

    .message.success {
      display: block;
      background: #10271c;
      border: 1px solid #36f5a0;
      color: #b8ffdc;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 24px;
      color: #36f5a0;
      text-decoration: none;
      font-size: 14px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <main class="login-card">
    <div class="logo">PAZZAN.COM</div>

    <h1 id="heading">Welcome Back</h1>
    <p class="subtitle" id="subtitle">
      Sign in to your account to continue.
    </p>

    <form id="authForm">
      <label for="email">Email address</label>
      <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Enter your password"
        minlength="6"
        required
      >

      <div id="confirmGroup" class="hidden">
        <label for="confirmPassword">Confirm password</label>
        <input
          id="confirmPassword"
          type="password"
          autocomplete="new-password"
          placeholder="Re-enter your password"
          minlength="6"
        >
      </div>

      <button class="main-button" id="submitBtn" type="submit">
        Login
      </button>
    </form>

    <p class="switch-text">
      <span id="switchLabel">Don't have an account?</span>
      <button class="switch-button" id="switchBtn" type="button">
        Create New Account
      </button>
    </p>

    <div id="message" class="message" role="status" aria-live="polite"></div>

    <a href="index.html" class="back-link">← Back to Website</a>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

    import {
      getAuth,
      setPersistence,
      browserLocalPersistence,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB3G98XBTZH6NFiZx6NQmyEKR8g6vnSYNQ",
      authDomain: "pasan-fc8e2.firebaseapp.com",
      projectId: "pasan-fc8e2",
      storageBucket: "pasan-fc8e2.firebasestorage.app",
      messagingSenderId: "330282693990",
      appId: "1:330282693990:web:f754a4a09efaa73ab5c4a7",
      measurementId: "G-B12LL33EQ3"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const form = document.getElementById("authForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const confirmInput = document.getElementById("confirmPassword");
    const confirmGroup = document.getElementById("confirmGroup");
    const submitBtn = document.getElementById("submitBtn");
    const switchBtn = document.getElementById("switchBtn");
    const switchLabel = document.getElementById("switchLabel");
    const heading = document.getElementById("heading");
    const subtitle = document.getElementById("subtitle");
    const message = document.getElementById("message");

    let createAccountMode = false;

    // Only allow known pages as redirect destinations.
    const requestedPage =
      new URLSearchParams(window.location.search).get("redirect");

    const allowedPages = [
      "dashboard.html",
      "index.html",
      "gallery.html"
    ];

    const destination = allowedPages.includes(requestedPage)
      ? requestedPage
      : "dashboard.html";

    function showMessage(text, type = "error") {
      message.textContent = text;
      message.className = "message " + type;
    }

    function setLoading(loading) {
      submitBtn.disabled = loading;
      switchBtn.disabled = loading;

      if (loading) {
        submitBtn.textContent = "Please wait…";
      } else {
        submitBtn.textContent =
          createAccountMode ? "Create Account" : "Login";
      }
    }

    switchBtn.addEventListener("click", () => {
      createAccountMode = !createAccountMode;

      confirmGroup.classList.toggle("hidden", !createAccountMode);
      confirmInput.required = createAccountMode;
      passwordInput.autocomplete = createAccountMode
        ? "new-password"
        : "current-password";

      heading.textContent = createAccountMode
        ? "Create Account"
        : "Welcome Back";

      subtitle.textContent = createAccountMode
        ? "Create your PAZZAN.COM account."
        : "Sign in to your account to continue.";

      switchLabel.textContent = createAccountMode
        ? "Already have an account?"
        : "Don't have an account?";

      switchBtn.textContent = createAccountMode
        ? "Login"
        : "Create New Account";

      submitBtn.textContent = createAccountMode
        ? "Create Account"
        : "Login";

      message.className = "message";
      message.textContent = "";
    });

    form.addEventListener("submit", async event => {
      event.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (createAccountMode &&
          password !== confirmInput.value) {
        showMessage("Passwords do not match.");
        return;
      }

      setLoading(true);
      message.className = "message";

      try {
        // Keep the login session in this browser.
        await setPersistence(auth, browserLocalPersistence);

        if (createAccountMode) {
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );

          showMessage(
            "Account created successfully. Opening the dashboard…",
            "success"
          );
        } else {
          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );

          showMessage(
            "Login successful. Opening the dashboard…",
            "success"
          );
        }

        window.location.replace(destination);

      } catch (error) {
        console.error("Authentication error:", error);

        const errors = {
          "auth/invalid-email": "Please enter a valid email address.",
          "auth/user-not-found": "No account was found for this email.",
          "auth/wrong-password": "Incorrect email or password.",
          "auth/invalid-credential": "Incorrect email or password.",
          "auth/email-already-in-use": "This email already has an account. Please log in.",
          "auth/weak-password": "Please use a stronger password with at least 6 characters.",
          "auth/network-request-failed": "Network error. Check your internet connection.",
          "auth/too-many-requests": "Too many attempts. Please wait and try again.",
          "auth/operation-not-allowed": "Enable Email/Password sign-in in Firebase Console."
        };

        showMessage(
          errors[error.code] ||
          `Login failed: ${error.message || "Please try again."}`
        );
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
