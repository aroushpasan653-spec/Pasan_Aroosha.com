<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | Pasan Aroosha</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, #24134d, #0b0f19 50%, #070a11);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #121826;
      padding: 35px;
      border-radius: 24px;
      border: 1px solid #2d2545;
      box-shadow: 0 25px 70px rgba(0,0,0,.5);
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: linear-gradient(135deg,#8b5cf6,#6d28d9);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 25px;
      font-weight: bold;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 30px;
      font-size: 14px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #d1d5db;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 18px;
      border-radius: 12px;
      border: 1px solid #30394d;
      background: #0b0f19;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #8b5cf6;
    }

    button {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    #loginBtn {
      border: none;
      color: white;
      background: linear-gradient(135deg,#8b5cf6,#6d28d9);
    }

    #signupBtn {
      background: transparent;
      color: #c4b5fd;
      border: 1px solid #6d28d9;
    }

    button:hover {
      opacity: .9;
    }

    #message {
      text-align: center;
      margin-top: 18px;
      min-height: 20px;
      font-size: 14px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #a78bfa;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">PA</div>

    <h1>Welcome Back</h1>

    <p class="subtitle">
      Login to your Pasan Aroosha account
    </p>

    <label for="email">
      Email Address
    </label>

    <input
      type="email"
      id="email"
      placeholder="Enter your email"
    >

    <label for="password">
      Password
    </label>

    <input
      type="password"
      id="password"
      placeholder="Enter your password"
    >

    <button id="loginBtn" type="button">
      Login
    </button>

    <button id="signupBtn" type="button">
      Create New Account
    </button>

    <p id="message"></p>

    <a href="index.html" class="back">
      ← Back to Website
    </a>

  </div>


  <script type="module">

    import {
      initializeApp
    } from
      "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword
    } from
      "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";


    const firebaseConfig = {

      apiKey:
        "AIzaSyB3G98XBTZH6NFiZx6NQmyEKR8g6vnSYNQ",

      authDomain:
        "pasan-fc8e2.firebaseapp.com",

      projectId:
        "pasan-fc8e2",

      storageBucket:
        "pasan-fc8e2.firebasestorage.app",

      messagingSenderId:
        "330282693990",

      appId:
        "1:330282693990:web:f754a4a09efaa73ab5c4a7",

      measurementId:
        "G-B12LL33EQ3"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    const email =
      document.getElementById("email");

    const password =
      document.getElementById("password");

    const loginBtn =
      document.getElementById("loginBtn");

    const signupBtn =
      document.getElementById("signupBtn");

    const message =
      document.getElementById("message");


    // LOGIN

    loginBtn.addEventListener("click", async () => {

      const userEmail =
        email.value.trim();

      const userPassword =
        password.value;


      if (!userEmail || !userPassword) {

        message.textContent =
          "Please enter your email and password.";

        message.style.color = "#f87171";

        return;
      }


      loginBtn.disabled = true;

      message.textContent =
        "Logging in...";

      message.style.color = "#a78bfa";


      try {

        await signInWithEmailAndPassword(
          auth,
          userEmail,
          userPassword
        );


        message.textContent =
          "✓ Login successful!";

        message.style.color =
          "#4ade80";


        setTimeout(() => {

          window.location.href =
            "index.html";

        }, 700);


      } catch (error) {

        console.error(error);

        message.style.color =
          "#f87171";


        if (
          error.code ===
          "auth/invalid-credential"
        ) {

          message.textContent =
            "Incorrect email or password.";

        } else {

          message.textContent =
            error.message;

        }


        loginBtn.disabled = false;

      }

    });


    // CREATE NEW ACCOUNT

    signupBtn.addEventListener("click", () => {

      window.location.href =
        "signup.html";

    });

  </script>

</body>

</html>
