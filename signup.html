<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Create Account | Pasan Aroosha</title>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {

      font-family: Arial, sans-serif;

      min-height: 100vh;

      background:
        radial-gradient(
          circle at top right,
          #24134d,
          #0b0f19 50%,
          #070a11
        );

      color: white;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 20px;

    }


    .card {

      width: 100%;

      max-width: 430px;

      background: #121826;

      padding: 35px;

      border-radius: 24px;

      border:
        1px solid #2d2545;

      box-shadow:
        0 25px 70px rgba(0,0,0,.5);

    }


    .logo {

      width: 70px;

      height: 70px;

      margin: 0 auto 20px;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          #8b5cf6,
          #6d28d9
        );

      display: flex;

      justify-content: center;

      align-items: center;

      font-size: 25px;

      font-weight: bold;

    }


    h1 {

      text-align: center;

      margin-bottom: 8px;

    }


    .subtitle {

      text-align: center;

      color: #9ca3af;

      font-size: 14px;

      margin-bottom: 30px;

    }


    label {

      display: block;

      margin-bottom: 8px;

      font-size: 14px;

      color: #d1d5db;

    }


    input {

      width: 100%;

      padding: 15px;

      margin-bottom: 18px;

      border-radius: 12px;

      border:
        1px solid #30394d;

      background: #0b0f19;

      color: white;

      outline: none;

      font-size: 15px;

    }


    input:focus {

      border-color:
        #8b5cf6;

    }


    button {

      width: 100%;

      padding: 15px;

      border: none;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          #8b5cf6,
          #6d28d9
        );

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      margin-top: 8px;

    }


    button:hover {

      opacity: .9;

    }


    button:disabled {

      opacity: .6;

      cursor: not-allowed;

    }


    #message {

      text-align: center;

      margin-top: 18px;

      min-height: 22px;

      font-size: 14px;

      line-height: 1.5;

    }


    .back {

      display: block;

      text-align: center;

      margin-top: 25px;

      color: #a78bfa;

      text-decoration: none;

      font-size: 14px;

    }

  </style>

</head>


<body>


  <div class="card">


    <div class="logo">
      PA
    </div>


    <h1>
      Create Account
    </h1>


    <p class="subtitle">
      Join Pasan Aroosha
    </p>


    <label for="email">
      Email Address
    </label>


    <input
      type="email"
      id="email"
      placeholder="Enter your email"
    >


    <label for="password">
      Password
    </label>


    <input
      type="password"
      id="password"
      placeholder="Create a password"
    >


    <label for="confirmPassword">
      Confirm Password
    </label>


    <input
      type="password"
      id="confirmPassword"
      placeholder="Confirm your password"
    >


    <button
      id="createBtn"
      type="button"
    >
      Create Account
    </button>


    <p id="message"></p>


    <a
      href="login.html"
      class="back"
    >
      ← Already have an account? Login
    </a>


  </div>



  <script type="module">


    import {
      initializeApp
    } from
      "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";


    import {
      getAuth,
      createUserWithEmailAndPassword
    } from
      "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";



    const firebaseConfig = {

      apiKey:
        "AIzaSyB3G98XBTZH6NFiZx6NQmyEKR8g6vnSYNQ",

      authDomain:
        "pasan-fc8e2.firebaseapp.com",

      projectId:
        "pasan-fc8e2",

      storageBucket:
        "pasan-fc8e2.firebasestorage.app",

      messagingSenderId:
        "330282693990",

      appId:
        "1:330282693990:web:f754a4a09efaa73ab5c4a7",

      measurementId:
        "G-B12LL33EQ3"

    };


    const app =
      initializeApp(firebaseConfig);


    const auth =
      getAuth(app);


    const email =
      document.getElementById("email");


    const password =
      document.getElementById("password");


    const confirmPassword =
      document.getElementById(
        "confirmPassword"
      );


    const createBtn =
      document.getElementById(
        "createBtn"
      );


    const message =
      document.getElementById(
        "message"
      );



    createBtn.addEventListener(
      "click",
      async () => {


        const userEmail =
          email.value.trim();


        const userPassword =
          password.value;


        const confirm =
          confirmPassword.value;



        if (!userEmail) {

          message.textContent =
            "Please enter your email.";

          message.style.color =
            "#f87171";

          return;

        }


        if (!userPassword) {

          message.textContent =
            "Please create a password.";

          message.style.color =
            "#f87171";

          return;

        }


        if (userPassword.length < 6) {

          message.textContent =
            "Password must be at least 6 characters.";

          message.style.color =
            "#f87171";

          return;

        }


        if (userPassword !== confirm) {

          message.textContent =
            "Passwords do not match.";

          message.style.color =
            "#f87171";

          return;

        }



        createBtn.disabled = true;


        message.textContent =
          "Creating your account...";

        message.style.color =
          "#a78bfa";



        try {


          await createUserWithEmailAndPassword(
            auth,
            userEmail,
            userPassword
          );


          message.textContent =
            "✓ Account created successfully!";

          message.style.color =
            "#4ade80";


          setTimeout(() => {

            window.location.href =
              "index.html";

          }, 1000);


        }


        catch (error) {


          console.error(error);

          message.style.color =
            "#f87171";


          if (
            error.code ===
            "auth/email-already-in-use"
          ) {

            message.textContent =
              "This email already has an account. Please login.";

          }


          else if (
            error.code ===
            "auth/invalid-email"
          ) {

            message.textContent =
              "Please enter a valid email address.";

          }


          else if (
            error.code ===
            "auth/operation-not-allowed"
          ) {

            message.textContent =
              "Email/Password authentication is not enabled in Firebase.";

          }


          else {

            message.textContent =
              error.message;

          }


          createBtn.disabled =
            false;

        }

      }

    );

  </script>


</body>

</html>
