
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAZZAN Neon Tetris</title>

<style>
:root {
  --blue: #00c8ff;
  --orange: #ff642e;
  --bg: #03091d;
  --panel: #050817;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background:
    radial-gradient(ellipse at top, #101b42 0%, #03091d 60%, #080313 100%);
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  padding: 12px;
  overflow-x: hidden;
}

header {
  text-align: center;
  padding: 8px 0 18px;
}

header h1 {
  font-size: clamp(34px, 6vw, 56px);
  font-weight: 900;
  letter-spacing: 4px;
  background: linear-gradient(90deg, #00eaff, white, #ff4c24);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 0 12px #00aaff55);
}

header p {
  color: #8fa8d7;
  font-size: 10px;
  letter-spacing: 4px;
  margin-top: 5px;
}

.game {
  max-width: 900px;
  margin: auto;
  display: grid;
  grid-template-columns: minmax(72px, 0.75fr) minmax(0, 1.5fr) minmax(80px, 0.75fr);
  gap: 10px;
  align-items: start;
}

.side {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.panel {
  background: rgba(2, 5, 19, 0.88);
  border: 2px solid #168bff;
  border-radius: 12px;
  padding: 12px 5px;
  text-align: center;
  box-shadow: 0 0 10px #0088ff44, inset 0 0 12px #07152d;
}

.panel.orange {
  border-color: var(--orange);
  box-shadow: 0 0 10px #ff512b44, inset 0 0 12px #28100c;
}

.panel h3 {
  font-size: clamp(10px, 2vw, 14px);
  letter-spacing: 2px;
  color: #c4eaff;
  margin-bottom: 12px;
}

.panel.orange h3 {
  color: #ffc08b;
}

.number {
  font-size: clamp(23px, 4vw, 34px);
  font-weight: 900;
  color: #fff;
  text-shadow: 0 0 12px var(--blue);
  overflow-wrap: anywhere;
}

.orange .number {
  color: #ffbd35;
  text-shadow: 0 0 12px #ff7500;
}

.preview {
  width: 100%;
  display: block;
  height: auto;
}

.board-wrap {
  border: 3px solid #168bff;
  border-radius: 6px;
  overflow: hidden;
  background: #05071b;
  box-shadow: 0 0 12px #008cff88, 0 0 30px #008cff22;
  position: relative;
}

#board {
  width: 100%;
  height: auto;
  display: block;
  touch-action: none;
}

#overlay {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  background: #020617dd;
  text-align: center;
  gap: 12px;
  padding: 10px;
}

#overlay.show {
  display: flex;
}

#overlay h2 {
  color: var(--blue);
  font-size: clamp(20px, 4vw, 32px);
  text-shadow: 0 0 15px var(--blue);
}

#overlay p {
  color: #d3e7ff;
  font-size: 13px;
}

button {
  color: white;
  background: #09152b;
  border: 1px solid var(--blue);
  border-radius: 8px;
  padding: 11px 8px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 8px #008cff22;
  -webkit-tap-highlight-color: transparent;
}

button:active {
  background: #075080;
  transform: scale(.96);
}

.orange-btn {
  border-color: var(--orange);
}

.controls-info {
  text-align: left;
  font-size: clamp(9px, 1.8vw, 12px);
  line-height: 2;
  color: #d4deef;
  overflow-wrap: anywhere;
}

.controls-info b {
  color: #fff;
}

.action-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
  max-width: 900px;
  margin: 14px auto 0;
}

.action-buttons button {
  font-size: 12px;
}

.touch-controls {
  max-width: 440px;
  margin: 18px auto 0;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  user-select: none;
}

.touch-controls button {
  min-height: 53px;
  font-size: 22px;
  touch-action: manipulation;
}

.touch-controls .small-label {
  display: block;
  font-size: 9px;
  margin-top: 3px;
  color: #8bdcff;
}

footer {
  text-align: center;
  color: #647ba7;
  font-size: 10px;
  letter-spacing: 2px;
  padding: 24px 0 12px;
}

@media (max-width: 520px) {
  body {
    padding: 7px;
  }

  header {
    padding-bottom: 12px;
  }

  header h1 {
    letter-spacing: 2px;
  }

  .game {
    gap: 6px;
    grid-template-columns: minmax(57px, .72fr) minmax(0, 2fr) minmax(65px, .8fr);
  }

  .side {
    gap: 7px;
  }

  .panel {
    padding: 9px 3px;
    border-radius: 8px;
    border-width: 1px;
  }

  .panel h3 {
    font-size: 9px;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  .number {
    font-size: 21px;
  }

  .controls-info {
    font-size: 9px;
    line-height: 1.8;
  }

  .touch-controls {
    gap: 5px;
  }

  .touch-controls button {
    padding: 6px 2px;
    min-height: 48px;
    font-size: 19px;
  }

  .touch-controls .small-label {
    font-size: 8px;
  }
}
</style>
</head>

<body>

<header>
  <h1>Tetris</h1>
  <p>NEON ARCADE EDITION</p>
</header>

<main class="game">

  <aside class="side">
    <section class="panel">
      <h3>HOLD</h3>
      <canvas id="hold" class="preview" width="120" height="100"></canvas>
    </section>

    <section class="panel orange">
      <h3>SCORE</h3>
      <div class="number" id="score">0</div>
    </section>

    <section class="panel">
      <h3>LEVEL</h3>
      <div class="number" id="level">1</div>
    </section>

    <section class="panel orange">
      <h3>LINES</h3>
      <div class="number" id="lines">0</div>
    </section>
  </aside>

  <section class="board-wrap">
    <canvas id="board" width="300" height="600"></canvas>
    <div id="overlay">
      <h2 id="overlay-title">PAUSED</h2>
      <p id="overlay-text">Take a break!</p>
      <button id="overlay-btn" onclick="togglePause()">RESUME</button>
    </div>
  </section>

  <aside class="side">
    <section class="panel">
      <h3>NEXT</h3>
      <canvas id="next" class="preview" width="120" height="300"></canvas>
    </section>

    <section class="panel orange">
      <div class="controls-info">
        <b>← →</b> Move<br>
        <b>↑</b> Rotate<br>
        <b>↓</b> Soft Drop<br>
        <b>SPACE</b> Hard Drop<br>
        <b>C</b> Hold<br>
        <b>P</b> Pause<br>
        <b>R</b> Restart
      </div>
    </section>
  </aside>

</main>

<div class="action-buttons">
  <button onclick="togglePause()" id="pauseBtn">⏸ PAUSE</button>
  <button class="orange-btn" onclick="restartGame()">↻ RESTART</button>
</div>

<div class="touch-controls">
  <button data-action="left">◀<span class="small-label">LEFT</span></button>
  <button data-action="rotate">↻<span class="small-label">ROTATE</span></button>
  <button data-action="down">▼<span class="small-label">DOWN</span></button>
  <button data-action="right">▶<span class="small-label">RIGHT</span></button>
  <button data-action="drop">⬇<span class="small-label">DROP</span></button>
</div>

<div class="action-buttons" style="max-width:440px">
  <button onclick="holdPiece()">📦 HOLD</button>
  <button onclick="togglePause()">⏯ PAUSE / PLAY</button>
</div>

<footer>PAZZAN GAMING • NEON TETRIS</footer>

<script>
"use strict";

const COLS = 10;
const ROWS = 20;

const COLORS = {
  I: "#00eaff",
  O: "#ffbd22",
  T: "#b65cff",
  S: "#00edb5",
  Z: "#ff3c48",
  J: "#438cff",
  L: "#ff5428"
};

const SHAPES = {
  I: [[1,1,1,1]],
  O: [[1,1],[1,1]],
  T: [[0,1,0],[1,1,1]],
  S: [[0,1,1],[1,1,0]],
  Z: [[1,1,0],[0,1,1]],
  J: [[1,0,0],[1,1,1]],
  L: [[0,0,1],[1,1,1]]
};

const boardCanvas = document.getElementById("board");
const ctx = boardCanvas.getContext("2d");
const holdCanvas = document.getElementById("hold");
const holdCtx = holdCanvas.getContext("2d");
const nextCanvas = document.getElementById("next");
const nextCtx = nextCanvas.getContext("2d");

let board;
let current;
let queue;
let held;
let canHold;
let score;
let lines;
let level;
let paused;
let gameOver;
let lastTime;
let dropCounter;
let animationId;

function createBoard() {
  return Array.from({length: ROWS}, () => Array(COLS).fill(null));
}

function randomPiece() {
  const keys = Object.keys(SHAPES);
  const type = keys[Math.floor(Math.random() * keys.length)];

  return {
    type,
    shape: SHAPES[type].map(row => row.slice()),
    x: 0,
    y: 0
  };
}

function refillQueue() {
  while (queue.length < 5) {
    const bag = Object.keys(SHAPES);

    for (let i = bag.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [bag[i], bag[j]] = [bag[j], bag[i]];
    }

    queue.push(...bag.map(type => ({
      type,
      shape: SHAPES[type].map(row => row.slice())
    })));
  }
}

function spawnPiece() {
  refillQueue();

  const item = queue.shift();

  current = {
    type: item.type,
    shape: item.shape.map(row => row.slice()),
    x: Math.floor((COLS - item.shape[0].length) / 2),
    y: 0
  };

  canHold = true;

  if (collides(current, 0, 0, current.shape)) {
    endGame();
  }

  drawPreviews();
}

function collides(piece, dx, dy, shape) {
  for (let y = 0; y < shape.length; y++) {
    for (let x = 0; x < shape[y].length; x++) {
      if (!shape[y][x]) continue;

      const bx = piece.x + x + dx;
      const by = piece.y + y + dy;

      if (bx < 0 || bx >= COLS || by >= ROWS) {
        return true;
      }

      if (by >= 0 && board[by][bx]) {
        return true;
      }
    }
  }

  return false;
}

function rotateMatrix(matrix) {
  return matrix[0].map((_, i) =>
    matrix.map(row => row[i]).reverse()
  );
}

function rotatePiece() {
  if (paused || gameOver) return;

  const rotated = rotateMatrix(current.shape);

  // Small wall kicks make rotation easier near the edges.
  for (const kick of [0, -1, 1, -2, 2]) {
    if (!collides(current, kick, 0, rotated)) {
      current.x += kick;
      current.shape = rotated;
      draw();
      return;
    }
  }
}

function movePiece(dx, dy) {
  if (paused || gameOver) return false;

  if (!collides(current, dx, dy, current.shape)) {
    current.x += dx;
    current.y += dy;
    return true;
  }

  if (dy > 0) lockPiece();

  return false;
}

function hardDrop() {
  if (paused || gameOver) return;

  let distance = 0;

  while (!collides(current, 0, 1, current.shape)) {
    current.y++;
    distance++;
  }

  score += distance * 2;
  updateStats();
  lockPiece();
}

function holdPiece() {
  if (paused || gameOver || !canHold) return;

  const oldType = held;
  held = current.type;

  if (oldType === null) {
    spawnPiece();
  } else {
    current = {
      type: oldType,
      shape: SHAPES[oldType].map(row => row.slice()),
      x: Math.floor((COLS - SHAPES[oldType][0].length) / 2),
      y: 0
    };

    if (collides(current, 0, 0, current.shape)) {
      endGame();
    }
  }

  canHold = false;
  drawPreviews();
  draw();
}

function lockPiece() {
  for (let y = 0; y < current.shape.length; y++) {
    for (let x = 0; x < current.shape[y].length; x++) {
      if (!current.shape[y][x]) continue;

      const by = current.y + y;
      const bx = current.x + x;

      if (by < 0) {
        endGame();
        return;
      }

      board[by][bx] = current.type;
    }
  }

  clearLines();
  spawnPiece();
  draw();
}

function clearLines() {
  let cleared = 0;

  for (let y = ROWS - 1; y >= 0; y--) {
    if (board[y].every(cell => cell !== null)) {
      board.splice(y, 1);
      board.unshift(Array(COLS).fill(null));
      cleared++;
      y++;
    }
  }

  if (cleared > 0) {
    const points = [0, 100, 300, 500, 800];

    score += (points[cleared] || 800) * level;
    lines += cleared;
    level = Math.floor(lines / 10) + 1;
    updateStats();
  }
}

function updateStats() {
  document.getElementById("score").textContent = score;
  document.getElementById("lines").textContent = lines;
  document.getElementById("level").textContent = level;
}

function drawCell(context, x, y, size, type, alpha = 1) {
  const color = COLORS[type];

  context.save();
  context.globalAlpha = alpha;

  context.fillStyle = color;
  context.shadowColor = color;
  context.shadowBlur = 7;

  context.fillRect(
    x * size + 1,
    y * size + 1,
    size - 2,
    size - 2
  );

  context.shadowBlur = 0;

  context.fillStyle = "#ffffff55";
  context.fillRect(
    x * size + 3,
    y * size + 3,
    Math.max(2, size * 0.23),
    Math.max(2, size * 0.23)
  );

  context.strokeStyle = "#07112a88";
  context.lineWidth = 1;
  context.strokeRect(
    x * size + 0.5,
    y * size + 0.5,
    size - 1,
    size - 1
  );

  context.restore();
}

function drawBackground() {
  ctx.fillStyle = "#05071b";
  ctx.fillRect(0, 0, boardCanvas.width, boardCanvas.height);

  const size = boardCanvas.width / COLS;

  ctx.strokeStyle = "#26335a45";
  ctx.lineWidth = 1;

  for (let x = 0; x <= COLS; x++) {
    ctx.beginPath();
    ctx.moveTo(x * size, 0);
    ctx.lineTo(x * size, boardCanvas.height);
    ctx.stroke();
  }

  for (let y = 0; y <= ROWS; y++) {
    ctx.beginPath();
    ctx.moveTo(0, y * size);
    ctx.lineTo(boardCanvas.width, y * size);
    ctx.stroke();
  }
}

function drawPiece(piece, alpha = 1, offsetY = 0) {
  const size = boardCanvas.width / COLS;

  for (let y = 0; y < piece.shape.length; y++) {
    for (let x = 0; x < piece.shape[y].length; x++) {
      if (piece.shape[y][x]) {
        drawCell(
          ctx,
          piece.x + x,
          piece.y + y + offsetY,
          size,
          piece.type,
          alpha
        );
      }
    }
  }
}

function draw() {
  drawBackground();

  const size = boardCanvas.width / COLS;

  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (board[y][x]) {
        drawCell(ctx, x, y, size, board[y][x]);
      }
    }
  }

  if (!gameOver && current) {
    // Ghost piece shows where the block will land.
    let ghostY = 0;

    while (!collides(current, 0, ghostY + 1, current.shape)) {
      ghostY++;
    }

    drawPiece(current, 0.2, ghostY);

    // Draw the active piece normally.
    drawPiece(current);
  }
}

function drawMini(context, canvas, pieces, single = false) {
  context.clearRect(0, 0, canvas.width, canvas.height);
  context.fillStyle = "#030615";
  context.fillRect(0, 0, canvas.width, canvas.height);

  const size = single ? 19 : 17;

  pieces.forEach((piece, index) => {
    if (!piece) return;

    const shape = piece.shape;
    const width = shape[0].length * size;
    const height = shape.length * size;

    const baseX = (canvas.width - width) / 2;
    const baseY = single
      ? (canvas.height - height) / 2
      : index * 60 + 10;

    shape.forEach((row, y) => {
      row.forEach((cell, x) => {
        if (!cell) return;

        context.fillStyle = COLORS[piece.type];
        context.shadowColor = COLORS[piece.type];
        context.shadowBlur = 5;

        context.fillRect(
          baseX + x * size + 1,
          baseY + y * size + 1,
          size - 2,
          size - 2
        );

        context.shadowBlur = 0;
        context.fillStyle = "#ffffff55";
        context.fillRect(
          baseX + x * size + 3,
          baseY + y * size + 3,
          4,
          4
        );
      });
    });
  });
}

function drawPreviews() {
  const heldPiece = held ? [{
    type: held,
    shape: SHAPES[held]
  }] : [];

  drawMini(holdCtx, holdCanvas, heldPiece, true);

  refillQueue();

  const nextPieces = queue.slice(0, 3).map(item => ({
    type: item.type,
    shape: item.shape
  }));

  drawMini(nextCtx, nextCanvas, nextPieces);
}

function endGame() {
  gameOver = true;

  document.getElementById("overlay-title").textContent = "GAME OVER";
  document.getElementById("overlay-text").textContent =
    "Final score: " + score;
  document.getElementById("overlay-btn").textContent = "PLAY AGAIN";
  document.getElementById("overlay-btn").onclick = restartGame;
  document.getElementById("overlay").classList.add("show");
  document.getElementById("pauseBtn").textContent = "▶ PLAY";
}

function togglePause() {
  if (gameOver) {
    restartGame();
    return;
  }

  paused = !paused;

  const overlay = document.getElementById("overlay");

  if (paused) {
    document.getElementById("overlay-title").textContent = "PAUSED";
    document.getElementById("overlay-text").textContent =
      "Ready when you are!";
    document.getElementById("overlay-btn").textContent = "RESUME";
    document.getElementById("overlay-btn").onclick = togglePause;
    overlay.classList.add("show");
    document.getElementById("pauseBtn").textContent = "▶ RESUME";
  } else {
    overlay.classList.remove("show");
    document.getElementById("pauseBtn").textContent = "⏸ PAUSE";
    lastTime = performance.now();
  }

  draw();
}

function restartGame() {
  if (animationId) cancelAnimationFrame(animationId);

  board = createBoard();
  queue = [];
  held = null;
  canHold = true;
  score = 0;
  lines = 0;
  level = 1;
  paused = false;
  gameOver = false;
  dropCounter = 0;
  lastTime = 0;

  document.getElementById("overlay").classList.remove("show");
  document.getElementById("pauseBtn").textContent = "⏸ PAUSE";

  updateStats();
  spawnPiece();
  drawPreviews();
  draw();

  animationId = requestAnimationFrame(update);
}

function update(time = 0) {
  if (gameOver) return;

  const delta = lastTime ? Math.min(time - lastTime, 100) : 0;
  lastTime = time;

  if (!paused) {
    dropCounter += delta;

    const interval = Math.max(90, 800 - (level - 1) * 65);

    if (dropCounter > interval) {
      movePiece(0, 1);
      dropCounter = 0;
    }

    draw();
  }

  animationId = requestAnimationFrame(update);
}

function handleAction(action) {
  if (action === "pause") {
    togglePause();
    return;
  }

  if (action === "restart") {
    restartGame();
    return;
  }

  if (action === "hold") {
    holdPiece();
    return;
  }

  if (paused || gameOver) return;

  switch (action) {
    case "left":
      movePiece(-1, 0);
      break;
    case "right":
      movePiece(1, 0);
      break;
    case "down":
      if (movePiece(0, 1)) {
        score++;
        updateStats();
      }
      dropCounter = 0;
      break;
    case "rotate":
      rotatePiece();
      break;
    case "drop":
      hardDrop();
      break;
  }

  draw();
}

document.addEventListener("keydown", event => {
  const keys = [
    "ArrowLeft", "ArrowRight", "ArrowDown", "ArrowUp", "Space"
  ];

  if (keys.includes(event.code)) event.preventDefault();

  if (event.repeat && ["Space", "ArrowUp"].includes(event.code)) return;

  switch (event.code) {
    case "ArrowLeft":
      handleAction("left");
      break;
    case "ArrowRight":
      handleAction("right");
      break;
    case "ArrowDown":
      handleAction("down");
      break;
    case "ArrowUp":
      handleAction("rotate");
      break;
    case "Space":
      handleAction("drop");
      break;
    case "KeyC":
    case "ShiftLeft":
    case "ShiftRight":
      handleAction("hold");
      break;
    case "KeyP":
    case "Escape":
      handleAction("pause");
      break;
    case "KeyR":
      restartGame();
      break;
  }
});

// Phone touch controls.
document.querySelectorAll("[data-action]").forEach(button => {
  const action = button.dataset.action;
  let repeatTimer = null;
  let repeatInterval = null;

  function stopRepeat() {
    clearTimeout(repeatTimer);
    clearInterval(repeatInterval);
    repeatTimer = null;
    repeatInterval = null;
  }

  button.addEventListener("pointerdown", event => {
    event.preventDefault();

    if (action === "left" || action === "right" || action === "down") {
      handleAction(action);

      repeatTimer = setTimeout(() => {
        repeatInterval = setInterval(() => {
          handleAction(action);
        }, action === "down" ? 70 : 110);
      }, 220);
    } else {
      handleAction(action);
    }
  });

  ["pointerup", "pointercancel", "pointerleave"].forEach(name => {
    button.addEventListener(name, stopRepeat);
  });
});

// Start the game.
restartGame();
</script>

</body>
</html>
